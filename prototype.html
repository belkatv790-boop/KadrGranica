<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17100A">
<title>КадрГраница — рабочее место миграционного комплаенса</title>
<!--
  КадрГраница · приложение
  Один самодостаточный файл. Открывается двойным щелчком, без сервера и сборки.
  Весь интерфейс рендерится из объекта DB (слой демо-данных) — подмените DB
  на реальные данные компании, и приложение продолжит работать без правок разметки.
  Мутации DB сохраняются в localStorage; сброс — в разделе «Настройки».
  Палитра и логотип — из презентации КадрГраница (эталон бренда).
-->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2317100A'/%3E%3Cg fill='none' stroke-width='7'%3E%3Cpath d='M36 11H13v42h23M24 22v24M24 34l14-13M24 34l14 14' stroke='%23FFFFFF'/%3E%3Cpath d='M45 11h8v13M53 40v13h-8' stroke='%23E2A85C'/%3E%3C/g%3E%3C/svg%3E">
<link rel="manifest" href="kadrgranitsa.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ═══════════ ТОКЕНЫ (эталон — презентация КадрГраница) ═══════════ */
:root{
  --graphite:#17100A; --g2:#1E150C; --g3:#281B10; --g4:#3A2A1A; --g5:#4A3A24;
  --page:#EFEAE0; --card:#FBFAF7; --card2:#F5F1E7;
  --ink:#241A10; --ink2:#5C4F3D; --ink3:#8A7B64; --ink4:#A89E89;
  --line:#E0D6C0; --line2:#CBBEA3; --line3:#EDE6D6;
  --gold:#C8A24E; --gold-d:#A9853B; --gold-bg:#F0E7CF; --gold-lt:#E2A85C; --gold-on:#F0C485;
  --red:#C64B2F; --red-bg:#F7E5DA; --red-br:#EFC9B6;
  --amber:#C87A1B; --amber-bg:#F8EDD3; --amber-br:#EFDAAE;
  --green:#4E8C4A; --green-bg:#EAF0DE; --green-br:#CFDDBB;
  --bronze:#B5742C; --bronze-bg:#F4E7CF;
  --on-gold:#22180C; --green-tx:#3D6C3A; --amber-tx:#8F5A14; --red-tx:#94381F;
  --acc-rgb:200,162,78; --acc2-rgb:181,116,44; --bad-rgb:198,75,47;
  --shadow-rgb:23,16,10; --shadow2-rgb:36,26,16; --page-rgb:239,234,224;
  --fb:'Golos Text',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --fm:'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace;
  --sh:0 10px 28px -16px rgba(var(--shadow2-rgb),.3);
  --sh-md:0 16px 42px -20px rgba(var(--shadow2-rgb),.36);
  --sh-lg:0 34px 80px -30px rgba(var(--shadow-rgb),.46);
  --ring:0 0 0 3px rgba(var(--acc-rgb),.42);
  --e:cubic-bezier(.2,.65,.25,1);
  --sbw:242px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:var(--fb);background:var(--page);color:var(--ink2);font-size:14px;line-height:1.55;
  -webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:inherit;text-decoration:none}
svg{display:block}
h1,h2,h3,h4{color:var(--ink);letter-spacing:-.018em;line-height:1.2;font-weight:700}
::selection{background:var(--gold);color:var(--on-gold)}
.mono{font-family:var(--fm);font-variant-numeric:tabular-nums}
:focus-visible{outline:none;box-shadow:var(--ring);border-radius:8px}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:9px;border:3px solid var(--page)}
::-webkit-scrollbar-thumb:hover{background:var(--ink4)}

/* ═══════════ КАРКАС ═══════════ */
#app{display:flex;height:100%;overflow:hidden}
.sb{width:var(--sbw);flex-shrink:0;background:var(--graphite);display:flex;flex-direction:column;
  padding:16px 12px 12px;overflow-y:auto;position:relative;z-index:30}
.sb::-webkit-scrollbar-thumb{background:var(--g4);border-color:var(--graphite)}
.sb .logo{display:flex;align-items:center;gap:10px;color:#fff;font-weight:700;font-size:14.5px;
  padding:4px 10px 18px;letter-spacing:.005em}
.sb .logo svg{flex-shrink:0;transition:transform .3s var(--e)}
.sb .logo:hover svg{transform:rotate(-5deg) scale(1.07)}
.sb .sec{font-family:var(--fm);font-size:8.5px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;
  color:var(--g5);padding:16px 12px 7px}
.sb .it{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:9px;color:var(--ink4);
  font-size:13px;font-weight:500;width:100%;text-align:left;transition:background .16s var(--e),color .16s,transform .16s var(--e);position:relative}
.sb .it svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.sb .it:hover{background:rgba(255,255,255,.06);color:#E8DCC4}
.sb .it.act{background:rgba(var(--acc-rgb),.18);color:var(--gold-on);font-weight:600}
.sb .it.act::before{content:"";position:absolute;left:-12px;top:9px;bottom:9px;width:3px;background:var(--gold);border-radius:0 3px 3px 0}
.sb .it .bdg{margin-left:auto;font-family:var(--fm);font-size:9.5px;font-weight:700;background:var(--red);
  color:#fff;border-radius:8px;padding:1px 7px;min-width:22px;text-align:center}
.sb .it .bdg.a{background:var(--amber)}
.sb .usr{margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px 10px;border-top:1px solid rgba(255,255,255,.09);
  border-radius:0;transition:background .16s;cursor:pointer}
.sb .usr:hover{background:rgba(255,255,255,.05)}
.sb .usr .ua{width:34px;height:34px;border-radius:10px;background:var(--g3);color:var(--gold-on);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex-shrink:0}
.sb .usr b{display:block;color:#fff;font-size:12.5px;line-height:1.3}
.sb .usr span{font-size:10.5px;color:var(--g5)}
.sb .usr .cv{margin-left:auto;color:var(--g5);font-size:11px}

.main{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
.top{flex-shrink:0;display:flex;align-items:center;gap:12px;padding:11px 24px;background:rgba(var(--page-rgb),.92);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--line);position:relative;z-index:20}
.top .comp{display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:8px 14px;font-weight:600;color:var(--ink);font-size:13px;transition:border-color .16s,box-shadow .16s}
.top .comp:hover{border-color:var(--line2);box-shadow:var(--sh)}
.top .srch{flex:1;max-width:440px;display:flex;align-items:center;gap:9px;background:var(--card);
  border:1px solid var(--line);border-radius:10px;padding:8px 14px;transition:border-color .16s,box-shadow .16s}
.top .srch:focus-within{border-color:var(--gold);box-shadow:var(--ring)}
.top .srch input{border:none;outline:none;font-size:13px;width:100%;background:transparent;color:var(--ink)}
.top .demo{margin-left:auto;font-family:var(--fm);font-size:9px;letter-spacing:.12em;color:var(--amber);
  background:var(--amber-bg);border:1px solid var(--amber-br);border-radius:7px;padding:6px 11px;font-weight:600;white-space:nowrap}
.top .ic-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);
  display:flex;align-items:center;justify-content:center;position:relative;transition:border-color .16s,transform .16s var(--e)}
.top .ic-btn:hover{border-color:var(--line2);transform:translateY(-1px)}
.top .ic-btn i{position:absolute;top:7px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--red);font-style:normal;
  box-shadow:0 0 0 2px var(--card)}
.top .ic-btn i.hide{display:none}

#view{flex:1;overflow-y:auto;padding:22px 24px 60px;scroll-behavior:smooth}
.wrap{max-width:1300px;margin:0 auto;width:100%}
@media(max-width:1080px){
  :root{--sbw:66px}
  .sb .logo span,.sb .it span:not(.bdg),.sb .sec,.sb .usr div,.sb .usr .cv{display:none}
  .sb .it{justify-content:center}
  .sb .it .bdg{position:absolute;top:2px;right:2px;margin:0;font-size:8px;padding:0 4px;min-width:16px}
  .top .demo{display:none}
}
@media(max-width:760px){
  #view{padding:16px 14px 48px}
  .top{padding:10px 14px}
  .top .comp{max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
}

/* ═══════════ ТИПОВЫЕ БЛОКИ ═══════════ */
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.ph h1{font-size:22px;font-weight:800;letter-spacing:-.024em}
.ph .sub{font-size:12.5px;color:var(--ink3);margin-top:4px}
.ph .actions{display:flex;gap:9px;flex-wrap:wrap}
.crumb{display:flex;align-items:center;gap:8px;font-family:var(--fm);font-size:10px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink3);margin-bottom:10px}
.crumb button{color:var(--gold-d);font-family:inherit;font-size:inherit;letter-spacing:inherit;font-weight:600}
.crumb button:hover{text-decoration:underline}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:13px;
  padding:9px 17px;border-radius:10px;border:1px solid transparent;white-space:nowrap;
  transition:transform .16s var(--e),box-shadow .18s var(--e),background .16s,border-color .16s,color .16s}
.btn:active{transform:translateY(0) scale(.98)}
.btn.t{background:var(--gold);color:var(--on-gold)}
.btn.t:hover{background:var(--gold-d);color:#fff;transform:translateY(-2px);box-shadow:0 12px 26px -12px rgba(var(--acc-rgb),.65)}
.btn.p{background:var(--graphite);color:#fff}
.btn.p:hover{background:var(--g3);transform:translateY(-2px);box-shadow:var(--sh-md)}
.btn.o{background:var(--card);color:var(--ink);border-color:var(--line)}
.btn.o:hover{border-color:var(--gold);color:var(--gold-d);transform:translateY(-2px)}
.btn.d{background:var(--red-bg);color:var(--red);border-color:var(--red-br)}
.btn.d:hover{background:var(--red);color:#fff;transform:translateY(-2px)}
.btn.sm{padding:6px 12px;font-size:12px;border-radius:8px}
.btn.xs{padding:4px 9px;font-size:11px;border-radius:7px}
.btn[disabled]{opacity:.45;pointer-events:none}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh);overflow:hidden}
.card.flat{box-shadow:none}
.pt{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 17px;border-bottom:1px solid var(--line3)}
.pt b{font-size:13.5px;color:var(--ink);font-weight:700}
.pt .mono{font-size:9.5px;color:var(--ink3);letter-spacing:.1em;text-transform:uppercase}
.pb{padding:14px 17px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g21{grid-template-columns:1.45fr .95fr}
.g12{grid-template-columns:.95fr 1.45fr}
@media(max-width:1180px){.g4{grid-template-columns:repeat(2,1fr)}.g21,.g12{grid-template-columns:1fr}}
@media(max-width:820px){.g3,.g2{grid-template-columns:1fr}}
@media(max-width:560px){.g4{grid-template-columns:1fr}}

.kpi{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:15px 17px;box-shadow:var(--sh);
  transition:transform .22s var(--e),box-shadow .22s var(--e),border-color .22s;position:relative;overflow:hidden}
.kpi:hover{transform:translateY(-3px);box-shadow:var(--sh-md);border-color:var(--line2)}
.kpi .l{font-size:11px;color:var(--ink3);font-weight:500}
.kpi .n{font-family:var(--fm);font-size:25px;font-weight:700;color:var(--ink);margin-top:5px;letter-spacing:-.035em;line-height:1.1}
.kpi .n small{font-size:12px;color:var(--ink3);font-weight:600;letter-spacing:0}
.kpi .s{font-size:10.5px;font-weight:600;margin-top:4px}
.kpi .s.up{color:var(--green)} .kpi .s.dn{color:var(--red)} .kpi .s.nt{color:var(--ink3)}
.kpi.red .n{color:var(--red)} .kpi.grn .n{color:var(--green)} .kpi.amb .n{color:var(--amber)}
.kpi.clk{cursor:pointer}
.kpi.clk::after{content:"→";position:absolute;right:14px;top:14px;color:var(--ink4);font-size:13px;opacity:0;transition:opacity .2s,transform .2s var(--e)}
.kpi.clk:hover::after{opacity:1;transform:translateX(3px)}

.pill{display:inline-flex;align-items:center;gap:5px;font-family:var(--fm);font-size:9.5px;font-weight:600;
  letter-spacing:.05em;padding:3px 9px;border-radius:6px;white-space:nowrap;border:1px solid transparent}
.pill.red{background:var(--red-bg);color:var(--red);border-color:var(--red-br)}
.pill.amb{background:var(--amber-bg);color:var(--amber);border-color:var(--amber-br)}
.pill.grn{background:var(--green-bg);color:var(--green);border-color:var(--green-br)}
.pill.tea{background:var(--gold-bg);color:var(--gold-d);border-color:rgba(var(--acc-rgb),.34)}
.pill.blu{background:var(--bronze-bg);color:var(--bronze);border-color:rgba(var(--acc2-rgb),.28)}
.pill.gry{background:var(--page);color:var(--ink3);border-color:var(--line)}

.chips{display:flex;gap:8px;flex-wrap:wrap}
.ch{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 15px;font-size:12.5px;
  font-weight:600;color:var(--ink2);transition:all .16s var(--e)}
.ch:hover{border-color:var(--gold);color:var(--gold-d);transform:translateY(-1px)}
.ch.on{background:var(--graphite);border-color:var(--graphite);color:#fff}
.ch .c{font-family:var(--fm);font-size:10px;opacity:.65;margin-left:5px}

table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);
  text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);background:var(--card2);white-space:nowrap}
.tbl td{padding:11px 14px;border-bottom:1px solid var(--line3);color:var(--ink2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tr.clk{cursor:pointer;transition:background .14s}
.tbl tr.clk:hover{background:var(--gold-bg)}
.tbl .nm{font-weight:600;color:var(--ink)}
.tbl .mono{font-size:11px;color:var(--ink3)}
.ava{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--g2),var(--g3));color:var(--gold-on);
  display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;margin-right:10px;
  vertical-align:middle;flex-shrink:0;font-family:var(--fm)}
.ava.lg{width:52px;height:52px;border-radius:14px;font-size:16px;margin:0}

.row{display:flex;align-items:center;gap:12px;padding:11px 17px;border-bottom:1px solid var(--line3);transition:background .14s}
.row:last-child{border-bottom:none}
.row:hover{background:var(--gold-bg)}
.row .tx{flex:1;min-width:0}
.row .tx b{display:block;color:var(--ink);font-weight:600;font-size:13px;line-height:1.35}
.row .tx span{display:block;color:var(--ink3);font-size:11.5px;margin-top:2px}
.row.ov{background:var(--red-bg)}
.row.ov:hover{background:var(--red-br)}
.row.done .tx b{text-decoration:line-through;color:var(--ink3)}

.chk{width:19px;height:19px;border:1.8px solid var(--line2);border-radius:6px;flex-shrink:0;display:flex;
  align-items:center;justify-content:center;transition:all .16s var(--e);background:var(--card)}
.chk:hover{border-color:var(--green)}
.chk.on{background:var(--green);border-color:var(--green);color:#fff}
.chk svg{width:11px;height:11px;stroke:currentColor;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.chk.on svg{opacity:1}

.empty{padding:44px 20px;text-align:center;color:var(--ink3)}
.empty b{display:block;color:var(--ink);font-size:14px;margin-bottom:6px}
.lead{display:flex;align-items:center;gap:0;font-size:12.5px}
.lead .dots{flex:1;border-bottom:1px dotted var(--line2);margin:0 9px;transform:translateY(-3px)}

.kv{display:flex;align-items:baseline;gap:8px;padding:8px 0;border-bottom:1px dotted var(--line3);font-size:13px}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--ink3);flex-shrink:0}
.kv .v{margin-left:auto;font-weight:600;color:var(--ink);text-align:right;font-family:var(--fm);font-size:12px}
.kv .v.r{color:var(--red)} .kv .v.a{color:var(--amber)} .kv .v.g{color:var(--green)}

.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:5.5px;top:8px;bottom:8px;width:1.5px;background:var(--line2)}
.tl .ti{position:relative;padding:9px 0;font-size:12.5px;color:var(--ink2);line-height:1.5}
.tl .ti::before{content:"";position:absolute;left:-21.5px;top:14px;width:11px;height:11px;border-radius:50%;
  background:var(--card);border:2px solid var(--line2)}
.tl .ti.done::before{background:var(--green);border-color:var(--green)}
.tl .ti.next::before{background:var(--amber);border-color:var(--amber);box-shadow:0 0 0 4px var(--amber-bg)}
.tl .ti.crit::before{background:var(--red);border-color:var(--red);box-shadow:0 0 0 4px var(--red-bg)}
.tl .ti b{color:var(--ink);font-weight:600}
.tl .ti .md{font-family:var(--fm);font-size:10px;color:var(--ink3);display:block;margin-top:2px;letter-spacing:.04em}

.bar{height:7px;background:var(--line3);border-radius:7px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:7px;transition:width .8s var(--e)}
.bar i.r{background:var(--red)} .bar i.a{background:var(--amber)} .bar i.g{background:var(--green)} .bar i.b{background:var(--bronze)}

.donut{width:112px;height:112px;border-radius:50%;position:relative;flex-shrink:0}
.donut::after{content:"";position:absolute;inset:18px;background:var(--card);border-radius:50%}
.donut .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:2}
.donut .c b{font-family:var(--fm);font-size:20px;font-weight:700;color:var(--ink);line-height:1}
.donut .c span{font-size:9px;color:var(--ink3);margin-top:3px}
.legend{display:flex;flex-direction:column;gap:7px;font-size:11.5px;color:var(--ink2);flex:1}
.legend button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:3px 6px;border-radius:7px;
  transition:background .14s,transform .14s var(--e)}
.legend button:hover{background:var(--gold-bg);transform:translateX(2px)}
.legend i{width:9px;height:9px;border-radius:3px;flex-shrink:0;font-style:normal}
.legend b{margin-left:auto;font-family:var(--fm);font-weight:700;color:var(--ink)}

/* ═══════════ КАЛЕНДАРЬ ═══════════ */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .dh{font-family:var(--fm);font-size:9.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink3);text-align:center;padding:4px 0}
.cal .dc{background:var(--card2);border:1px solid transparent;border-radius:9px;min-height:78px;padding:6px 7px;
  text-align:left;transition:all .16s var(--e);position:relative;overflow:hidden}
.cal .dc:hover{border-color:var(--gold);transform:translateY(-2px);box-shadow:var(--sh)}
.cal .dc.out{opacity:.4}
.cal .dc.today{border-color:var(--gold-d);background:var(--gold-bg)}
.cal .dc.sel{border-color:var(--graphite);background:var(--card);box-shadow:var(--sh-md)}
.cal .dc .dn{font-family:var(--fm);font-size:11.5px;font-weight:700;color:var(--ink2)}
.cal .dc .ev{display:block;font-size:9px;border-radius:4px;padding:2px 5px;margin-top:3px;font-weight:600;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal .dc .ev.r{background:var(--red-bg);color:var(--red)}
.cal .dc .ev.a{background:var(--amber-bg);color:var(--amber)}

/* ───────── 2. Хранилище: DB живёт в localStorage ───────── */
var LS_KEY = 'kadrgranitsa.db.v1';
var DB;
function loadDB(){
  try{
    var raw = localStorage.getItem(LS_KEY);
    if(raw){
      var parsed = JSON.parse(raw);
      if(parsed && parsed.version === 1 && parsed.employees && parsed.employees.length) return parsed;
    }
  }catch(e){}
  return buildDB();
}
function saveDB(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(DB)); }
  catch(e){ /* приватный режим — работаем без персистентности */ }
}
function resetDB(){
  try{ localStorage.removeItem(LS_KEY); }catch(e){}
  DB = buildDB(); saveDB();
}

/* ───────── 3. Производные показатели — считаются из DB ───────── */
var M = {
  emps:      function(){ return DB.employees.length; },
  open:      function(){ return DB.tasks.filter(function(t){ return !t.done; }); },
  overdue:   function(){ return M.open().filter(function(t){ return daysLeft(t.due) < 0; }); },
  critical:  function(){ return M.open().filter(function(t){ var d=daysLeft(t.due); return t.prio==='crit' && d>=0 && d<=7; }); },
  week:      function(){ return M.open().filter(function(t){ var d=daysLeft(t.due); return d>=0 && d<=7; }); },
  today:     function(){ return M.open().filter(function(t){ return daysLeft(t.due)===0; }); },
  waitingDoc:function(){ return M.open().filter(function(t){ return t.kind==='doc'; }); },
  highRisks: function(){ return DB.risks.filter(function(r){ return r.level==='high'; }); },
  riskTotal: function(){ return DB.risks.reduce(function(s,r){ return s + r.amount; }, 0); },
  /* Compliance score = 100 − вес критичных − вес просроченных − вес высоких рисков */
  score:     function(){
    var v = DB.meta.scoreBase - M.critical().length*0.28 - M.overdue().length*1.2 - M.highRisks().length*0.15;
    return Math.max(0, Math.min(100, Math.round(v)));
  },
  byRisk:    function(lv){ return DB.employees.filter(function(e){ return e.risk===lv; }); },
  emp:       function(id){ return DB.employees.filter(function(e){ return e.id===id; })[0]; },
  empTasks:  function(id){ return DB.tasks.filter(function(t){ return t.empId===id; }); },
  empDocs:   function(id){ return DB.documents.filter(function(d){ return d.empId===id; }); },
  risk:      function(id){ return DB.risks.filter(function(r){ return r.id===id; })[0]; },
  alerts:    function(){
    var a = M.overdue().map(function(t){ return {t:'Просрочено: '+t.title, s:dueLabel(t.due).t, go:'dead', id:t.id, lv:'crit'}; });

    return a;
  }
};

/* ───────── 5. Обратная связь: тосты, занятость, модалки ───────── */
function toast(title, sub, type){
  var box = $('#toasts');
  var el = document.createElement('div');
  el.className = 'toast ' + (type||'');
  var icon = type==='ok' ? '✓' : type==='warn' ? '!' : type==='err' ? '✕' : '·';
  el.innerHTML = '<span class="ti">'+icon+'</span><div class="tb"><b>'+esc(title)+'</b>'+
                 (sub ? '<div class="tx2">'+esc(sub)+'</div>' : '')+'</div>';
  box.appendChild(el);
  setTimeout(function(){
    el.classList.add('out');
    setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); }, 320);
  }, 3600);
}
function busy(label, ms){
  return new Promise(function(resolve){
    var box = $('#busy'), bar = $('#busy-bar'), pc = $('#busy-pc');
    $('#busy-label').textContent = label;
    box.classList.add('on'); bar.style.width = '0'; pc.textContent = '0%';
    var t0 = performance.now();
    (function tick(t){
      var p = Math.min((t - t0) / ms, 1);
      bar.style.width = (p*100).toFixed(0) + '%';
      pc.textContent = Math.round(p*100) + '%';
      if(p < 1){ requestAnimationFrame(tick); }
      else { setTimeout(function(){ box.classList.remove('on'); resolve(); }, 180); }
    })(t0);
  });
}
function openModal(opts){
  var ov = $('#overlay');
  ov.innerHTML =
    '<div class="modal'+(opts.wide?' wide':'')+'" role="dialog" aria-modal="true">' +
      '<div class="mh"><b>'+esc(opts.title)+'</b><button class="x" data-act="closeModal" aria-label="Закрыть">✕</button></div>' +
      '<div class="mb">'+opts.body+'</div>' +
      (opts.footer ? '<div class="mf">'+opts.footer+'</div>' : '') +
    '</div>';
  ov.classList.add('on');
  var first = ov.querySelector('input,select,textarea,button.btn');
  if(first) setTimeout(function(){ first.focus(); }, 60);
  if(opts.onOpen) opts.onOpen(ov);
}
function closeModal(){ var ov=$('#overlay'); ov.classList.remove('on'); ov.innerHTML=''; }

}

function pillFor(lv){
  var map = { crit:['red','критический'], high:['amb','высокий'], mid:['blu','средний'], low:['grn','низкий'] };
  var m = map[lv] || map.low;
  return '<span class="pill '+m[0]+'">'+m[1]+'</span>';
}
function prioPill(p){
  var map = { crit:['red','критич.'], high:['amb','высокий'], mid:['blu','средний'], low:['gry','низкий'] };
  var m = map[p] || map.low;
  return '<span class="pill '+m[0]+'">'+m[1]+'</span>';
}
function duePill(due){ var d = dueLabel(due); return '<span class="pill '+d.c+'">'+esc(d.t)+'</span>'; }
function empRow(e){
  return '<span class="ava">'+esc(initials(e.fio))+'</span>';
}
function taskRow(t){
  var e = M.emp(t.empId);
  var over = !t.done && daysLeft(t.due) < 0;
  return '<div class="row'+(over?' ov':'')+(t.done?' done':'')+'" data-act="taskOpen:'+t.id+'">' +
    '<button class="chk'+(t.done?' on':'')+'" data-act="taskToggle:'+t.id+'" aria-label="Отметить выполненным">' +
      '<svg viewBox="0 0 24 24"><path d="M4 12.5l5.5 5.5L20 6.5"/></svg></button>' +
    '<div class="tx"><b>'+esc(t.title)+'</b><span>'+esc(e ? e.fio + ' · ' + e.object : 'общая задача')+' · срок '+dmy(t.due)+'</span></div>' +
    prioPill(t.prio) + duePill(t.due) +
    '</div>';
}
function emptyBox(title, sub, act){
  return '<div class="empty"><b>'+esc(title)+'</b>'+esc(sub||'')+
    (act ? '<div style="margin-top:14px">'+act+'</div>' : '')+'</div>';
}

function filteredEmps(){
  var q = state.empSearch.trim().toLowerCase();

    if(state.empFilter === 'crit' && e.risk !== 'crit') return false;
    if(state.empFilter === 'high' && e.risk !== 'high') return false;

    if(q && (e.fio+' '+e.citizenship+' '+e.position+' '+e.object+' '+e.status).toLowerCase().indexOf(q) < 0) return false;

/* ═══════════ ЭКРАН: ДЕДЛАЙНЫ ═══════════ */
function viewDead(){
  var tab = state.deadTab;
  var all = DB.tasks.slice().sort(function(a,b){
    if(a.done !== b.done) return a.done ? 1 : -1;
    return parseISO(a.due) - parseISO(b.due);
  });
  var list = all.filter(function(t){
    var d = daysLeft(t.due);
    if(tab === 'today')  return !t.done && d === 0;
    if(tab === 'week')   return !t.done && d >= 0 && d <= 7;
    if(tab === 'over')   return !t.done && d < 0;
    if(tab === 'done')   return t.done;
    return true;
  });
  var h = '<div class="ph"><div><h1>Дедлайны</h1><div class="sub">Обязательства с контролируемыми сроками · '+M.open().length+' открытых</div></div>' +
    '<div class="actions"><button class="btn o" data-act="go:cal">Календарь</button>' +
    '<button class="btn t" data-act="addTask">+ Создать задачу</button></div></div>';

  h += '<div class="grid g4" style="margin-bottom:14px">' +
    '<div class="kpi red clk" data-act="deadTab:over"><div class="l">Просрочено</div><div class="n">'+M.overdue().length+'</div><div class="s dn">требует действия сегодня</div></div>' +

function viewCal(){
  var y = state.calYear, m = state.calMonth;
  var first = new Date(y, m, 1);
  var startWd = (first.getDay() + 6) % 7;
  var start = addDays(first, -startWd);
  var byDay = {};
  DB.tasks.forEach(function(t){ (byDay[t.due] = byDay[t.due] || []).push(t); });

  var h = '<div class="ph"><div><h1>Календарь</h1><div class="sub">События контура по датам · '+DB.tasks.length+' обязательств</div></div>' +
    '<div class="actions cal-nav">' +
    '<button data-act="calPrev" aria-label="Предыдущий месяц">‹</button>' +
    '<span class="m">'+MONTHS_N[m]+' '+y+'</span>' +
    '<button data-act="calNext" aria-label="Следующий месяц">›</button>' +
    '<button class="btn o sm" data-act="calToday">Сегодня</button></div></div>';

  h += '<div class="grid g21"><div class="card"><div class="pb">';
  h += '<div class="cal">' + WD.map(function(d){ return '<div class="dh">'+d+'</div>'; }).join('');
  for(var i=0;i<42;i++){
    var d = addDays(start, i), k = iso(d);
    var out = d.getMonth() !== m;
    var evs = byDay[k] || [];
    var cls = 'dc' + (out?' out':'') + (k===iso(TODAY)?' today':'') + (k===state.calDay?' sel':'');
    h += '<button class="'+cls+'" data-act="calDay:'+k+'"><span class="dn">'+d.getDate()+'</span>';
    evs.slice(0,2).forEach(function(t){
      var c = t.done ? 'g' : daysLeft(t.due)<0 ? 'r' : t.prio==='crit' ? 'r' : t.prio==='high' ? 'a' : 't';
      h += '<span class="ev '+c+'">'+esc(t.title.split(' — ')[0])+'</span>';
    });
    if(evs.length > 2) h += '<span class="ev t">ещё '+(evs.length-2)+'</span>';
    h += '</button>';
  }
  h += '</div>';
  h += '<div style="display:flex;gap:16px;margin-top:14px;flex-wrap:wrap;font-size:11.5px;color:var(--ink3)">' +
    '<span><i style="display:inline-block;width:9px;height:9px;border-radius:3px;background:var(--red);margin-right:6px"></i>критическое / просроченное</span>' +
    '<span><i style="display:inline-block;width:9px;height:9px;border-radius:3px;background:var(--amber);margin-right:6px"></i>высокий приоритет</span>' +
    '<span><i style="display:inline-block;width:9px;height:9px;border-radius:3px;background:var(--gold);margin-right:6px"></i>плановое</span>' +
    '<span><i style="display:inline-block;width:9px;height:9px;border-radius:3px;background:var(--green);margin-right:6px"></i>исполнено</span></div>';
  h += '</div></div>';

  var dayEvs = (byDay[state.calDay] || []);
  h += '<div class="card"><div class="pt"><b>'+human(state.calDay)+'</b><span class="mono">'+dayEvs.length+' событий</span></div><div>';
  if(!dayEvs.length) h += emptyBox('На эту дату событий нет','Выберите другой день в календаре');
  dayEvs.forEach(function(t){ h += taskRow(t); });
  h += '</div></div></div>';
  return h;
}

var NOTIF_KINDS = ['о заключении договора','о расторжении договора','о смене места работы','о выплатах ВКС'];
var NOTIF_TO = ['МВД по г. Москве','МВД по Московской области','ГУ МВД России (иной регион)'];
function wizChecks(){
  var e = state.wiz.empId ? M.emp(state.wiz.empId) : null;
  var out = [];
  if(!e){ out.push({t:'bad', txt:'Сотрудник не выбран — вернитесь к шагу 1'}); return out; }
  out.push({t:'ok', txt:'Досье заполнено: '+e.fio+', '+e.citizenship+', '+e.status});
  out.push({t:'ok', txt:'Ключевой документ: '+e.docType+' № '+e.docNo+', действует до '+dmy(e.docTo)});
  var dl = daysLeft(e.docTo);
  if(dl < 0) out.push({t:'bad', txt:'Срок действия документа истёк — подача уведомления не снимает нарушения'});
  else if(dl <= 30) out.push({t:'warn', txt:'Документ истекает через '+dl+' дн. — параллельно запустите продление'});
  else out.push({t:'ok', txt:'Срок действия документа достаточен'});
  if(state.wiz.kind === 'о заключении договора'){
    var since = Math.abs(daysLeft(e.hiredAt));
    if(since > 3) out.push({t:'warn', txt:'С даты договора прошло '+since+' дн. — трёхдневное окно уже вышло, зафиксируйте причину в журнале'});
    else out.push({t:'ok', txt:'Трёхдневное окно соблюдено: с даты договора прошло '+since+' дн.'});
  }
  if(state.wiz.kind === 'о выплатах ВКС' && e.status !== 'ВКС')
    out.push({t:'bad', txt:'Тип уведомления применим только к ВКС — выберите другой тип'});
  out.push({t:'ok', txt:'Адресат определён по региону объекта: '+state.wiz.to});
  out.push({t:'ok', txt:'Правило движка 01/214 · срок 3 рабочих дня · форма КГ-У-01'});
  return out;
}

function wizValidate(step){

  var k = $('#wkind'), t = $('#wto'), d = $('#wdate'), b = $('#wbasis');

function wizSend(){
  if(!state.wiz.empId){ toast('Выберите сотрудника','Без досье форма не собирается','err'); return; }
  var e = M.emp(state.wiz.empId);
  busy('Отправка уведомления в ' + state.wiz.to + '…', 1500).then(function(){
    var rec = { id: uid('N'), empId: e.id, kind: state.wiz.kind, to: state.wiz.to,
      at: iso(TODAY), status:'sent', ack:'подтверждение ожидается' };
    DB.notificationsSent.push(rec);
    if(state.wiz.kind === 'о заключении договора'){
      e.notifyHire = 'confirmed';
      DB.tasks.forEach(function(t){
        if(t.empId===e.id && !t.done && t.title.indexOf('Уведомление о приёме')===0) t.done = true;
      });
    }
    logAction('notify', 'Отправлено уведомление ' + state.wiz.kind + ' — ' + e.fio + ' (' + state.wiz.to + ')', true);
    saveDB();
    state.wizStep = 1; state.wiz.empId = null; state.wiz.basis = '';
    render();
    toast('Уведомление отправлено', e.fio + ' · запись добавлена в журнал доказательств', 'ok');
  });

  if(q.length < 2){ box.classList.remove('on'); box.innerHTML=''; return; }
  var emps = DB.employees.filter(function(e){ return e.fio.toLowerCase().indexOf(q) > -1 || e.object.toLowerCase().indexOf(q) > -1; }).slice(0,5);
  var tasks = DB.tasks.filter(function(t){ return t.title.toLowerCase().indexOf(q) > -1; }).slice(0,4);
  var rules = DB.rules.filter(function(r){ return (r.title+' '+r.id).toLowerCase().indexOf(q) > -1; }).slice(0,3);
  var docs = DB.documents.filter(function(d){ return d.name.toLowerCase().indexOf(q) > -1; }).slice(0,3);
  var h = '';
  if(emps.length){ h += '<div class="sg">Сотрудники</div>' + emps.map(function(e){
    return '<button data-act="emp:'+e.id+'">' + empRow(e) + '<span class="nm">' + esc(e.fio) + '</span><span class="ds">' + esc(e.status) + '</span></button>'; }).join(''); }
  if(tasks.length){ h += '<div class="sg">Задачи и сроки</div>' + tasks.map(function(t){
    return '<button data-act="taskOpen:'+t.id+'"><span class="nm">' + esc(t.title) + '</span><span class="ds">' + dmy(t.due) + '</span></button>'; }).join(''); }
  if(rules.length){ h += '<div class="sg">Правила</div>' + rules.map(function(r){
    return '<button data-act="ruleGo:'+r.id+'"><span class="nm">' + esc(r.title) + '</span><span class="ds">' + esc(r.id) + '</span></button>'; }).join(''); }
  if(docs.length){ h += '<div class="sg">Документы</div>' + docs.map(function(d){
    return '<button data-act="openDoc:'+d.id+'"><span class="nm">' + esc(d.name) + '</span><span class="ds">' + esc(d.type) + '</span></button>'; }).join(''); }
  if(!h) h = '<div class="empty" style="padding:24px"><b>Ничего не найдено</b>Попробуйте другой запрос</div>';
  box.innerHTML = h; box.classList.add('on');
}

/* ═══════════ ДЕЛЕГИРОВАНИЕ СОБЫТИЙ ═══════════ */
document.addEventListener('click', function(ev){
  var node = ev.target.closest ? ev.target.closest('[data-act]') : null;

  /* закрытие модалки по клику на подложку */
  if(ev.target.id === 'overlay'){ closeModal(); return; }
  /* закрытие дропдаунов при клике мимо */
  if(!ev.target.closest('#belldd') && !ev.target.closest('[data-act="bell"]') && state.bell){
    state.bell = false; renderBell();
  }
  if(!ev.target.closest('#sres') && !ev.target.closest('#gsearch')){
    var sr = $('#sres'); if(sr) sr.classList.remove('on');
  }
  if(!node) return;

  var raw = node.getAttribute('data-act');
  var i = raw.indexOf(':');
  var key = i < 0 ? raw : raw.slice(0, i);
  var val = i < 0 ? null : raw.slice(i + 1);
  var fn = ACTIONS[key];

  ev.preventDefault();
  ev.stopPropagation();

  if(typeof fn === 'function'){ fn(val, ev); return; }
  /* ни одна кнопка не молчит */
  toast('Функция в разработке', 'В этой версии демонстрационного контура действие «' + raw + '» не подключено', 'warn');
}, false);

/* поля ввода */
document.addEventListener('input', function(ev){
  var t = ev.target;
  if(t.id === 'empq'){
    state.empSearch = t.value; state.empLimit = 25;
    var pos = t.selectionStart;
    render();
    var again = $('#empq');
    if(again){ again.focus(); try{ again.setSelectionRange(pos, pos); }catch(e){} }
  }
  if(t.id === 'gsearch'){ renderSearch(t.value); }
  if(t.id === 'wkind' || t.id === 'wto' || t.id === 'wdate' || t.id === 'wbasis'){ wizCollect(); }
});
document.addEventListener('change', function(ev){
  var t = ev.target;
  if(t.id === 'wkind' || t.id === 'wto' || t.id === 'wdate'){ wizCollect(); render(); }
});

/* клавиатура */
document.addEventListener('keydown', function(ev){
  if(ev.key === 'Escape'){
    if($('#overlay').classList.contains('on')){ closeModal(); return; }
    if(state.bell){ state.bell = false; renderBell(); return; }
    var sr = $('#sres'); if(sr && sr.classList.contains('on')){ sr.classList.remove('on'); return; }
    if(state.screen === 'emp'){ go('emps'); }
  }
  if((ev.ctrlKey || ev.metaKey) && ev.key === 'k'){ ev.preventDefault(); var g = $('#gsearch'); if(g) g.focus(); }
});

/* ═══════════ СТАРТ ═══════════ */
DB = loadDB();
saveDB();
render();
renderBell();

/* приветственный тост — сразу видно, что контур живой */
setTimeout(function(){
  toast('Контур загружен',
        nfmt(M.emps()) + ' досье · ' + M.critical().length + ' критических дедлайнов · score ' + M.score(),
        'ok');
}, 500);
</script>

var THEME_KEY = 'kadrgranitsa.theme';
var DENSE_KEY = 'kadrgranitsa.dense';

function applyTheme(k, silent){
  var t = THEMES[k]; if(!t) return;
  var r = document.documentElement;
  for(var v in t.v) r.style.setProperty(v, t.v[v]);
  var meta = document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute('content', t.v['--graphite']);
  DB.settings.theme = k;
  try{ localStorage.setItem(THEME_KEY, k); }catch(e){}
  saveDB();
  if(!silent){ render(); toast('Палитра изменена', t.name, 'ok'); }
}
function applyDense(on, silent){
  document.body.classList.toggle('dense', !!on);
  DB.settings.dense = !!on;
  try{ localStorage.setItem(DENSE_KEY, on ? '1' : '0'); }catch(e){}
  saveDB();
  if(!silent){ render(); toast(on ? 'Компактный режим включён' : 'Обычная плотность', on ? 'больше строк на экране' : 'больше воздуха', 'ok'); }
}

/* ───────── 2. РАЗДЕЛ «АНАЛИТИКА» ───────── */
function groupCount(arr, keyFn){
  var m = {};
  arr.forEach(function(x){ var k = keyFn(x); m[k] = (m[k]||0) + 1; });
  return Object.keys(m).map(function(k){ return {k:k, n:m[k]}; }).sort(function(a,b){ return b.n - a.n; });
}
function barBlock(title, rows, total, color){
  var h = '<div class="card"><div class="pt"><b>' + esc(title) + '</b><span class="mono">' + rows.length + ' значений</span></div><div class="pb"><div class="an-bars">';
  rows.forEach(function(r){
    var p = total ? Math.round(r.n / total * 100) : 0;
    h += '<div class="an-row"><span class="k2">' + esc(r.k) + '</span>' +
      '<span class="bar"><i class="' + color + '" style="width:' + Math.max(2, p) + '%"></i></span>' +
      '<span class="v2">' + r.n + '</span></div>';
  });
  h += '</div></div></div>';
  return h;
}
function viewAnalytics(){
  var emps = DB.employees;
  var byCit = groupCount(emps, function(e){ return e.citizenship; }).slice(0, 8);
  var bySt  = groupCount(emps, function(e){ return e.status; });
  var byObj = groupCount(emps, function(e){ return e.object; });
  var open = M.open();
  var byAssignee = groupCount(open, function(t){ return t.assignee; });
  var byKind = groupCount(open, function(t){ return ({doc:'Документы и сроки', notify:'Уведомления', reg:'Регистрация', audit:'Аудит и сканы', report:'Отчётность', rules:'Изменения закона'})[t.kind] || t.kind; });

  /* нагрузка по неделям вперёд — из реальных сроков */
  var weeks = [0,0,0,0,0,0];
  open.forEach(function(t){
    var d = daysLeft(t.due);
    if(d < 0) { weeks[0]++; return; }
    var w = Math.min(5, Math.floor(d / 7));
    weeks[w]++;
  });
  var maxW = Math.max.apply(null, weeks) || 1;
  var wLabels = ['просроч.','1 нед.','2 нед.','3 нед.','4 нед.','5+ нед.'];

  var score = M.score();
  var closed = DB.tasks.filter(function(t){ return t.done; }).length;
  var ratio = DB.tasks.length ? Math.round(closed / DB.tasks.length * 100) : 0;
  var riskPerEmp = Math.round(M.riskTotal() / Math.max(1, emps.length));

  var h = '<div class="ph"><div><h1>Аналитика</h1><div class="sub">Срез контура на ' + human(iso(TODAY)) + ' · всё считается из данных</div></div>' +
    '<div class="actions"><button class="btn o" data-act="exportAnalytics">⤓ Выгрузить срез</button>' +
    '<button class="btn t" data-act="report">⤓ Отчёт руководителю</button></div></div>';

  h += '<div class="grid g4" style="margin-bottom:14px">' +
    '<div class="kpi grn clk" data-act="scoreInfo"><div class="l">Compliance score</div><div class="n">' + score + '<small>/100</small></div><div class="s ' + (score>=90?'up':'dn') + '">' + (score>=90?'хороший уровень':'требует внимания') + '</div></div>' +
    '<div class="kpi"><div class="l">Исполнено обязательств</div><div class="n">' + ratio + '<small>%</small></div><div class="s nt">' + closed + ' из ' + DB.tasks.length + '</div></div>' +
    '<div class="kpi red"><div class="l">Риск на одного работника</div><div class="n">' + nfmt(riskPerEmp) + '<small> ₽</small></div><div class="s nt">' + rub(M.riskTotal()) + ' всего</div></div>' +
    '<div class="kpi amb"><div class="l">Нагрузка на 7 дней</div><div class="n">' + M.week().length + '</div><div class="s nt">обязательств в работе</div></div>' +
    '</div>';

  h += '<div class="grid g2" style="margin-bottom:14px">';
  h += '<div class="card"><div class="pt"><b>Нагрузка по срокам</b><span class="mono">' + open.length + ' открытых</span></div><div class="pb">' +
    '<div class="spark">' + weeks.map(function(n){
      return '<div class="sb" style="height:' + Math.max(4, Math.round(n/maxW*96)) + 'px"><span>' + n + '</span></div>';
    }).join('') + '</div>' +
    '<div class="spark-x">' + wLabels.map(function(l){ return '<span>' + l + '</span>'; }).join('') + '</div>' +
    '<div style="margin-top:14px;font-size:12px;color:var(--ink3);line-height:1.55">Пик слева — то, что нужно закрыть немедленно. Ровный профиль справа означает, что контур работает на опережение.</div>' +
    '</div></div>';

  var lv = {crit:M.byRisk('crit').length, high:M.byRisk('high').length, mid:M.byRisk('mid').length, low:M.byRisk('low').length};
  h += '<div class="card"><div class="pt"><b>Карта риска по штату</b><span class="mono">' + nfmt(emps.length) + ' досье</span></div><div class="pb">' +
    '<div class="heat">' + emps.slice(0, 120).map(function(e){
      var c = e.risk==='crit' ? 'var(--red)' : e.risk==='high' ? 'var(--amber)' : e.risk==='mid' ? 'var(--bronze)' : 'var(--green)';
      return '<i style="background:' + c + ';opacity:' + (e.risk==='low'?'.45':'.9') + '" title="' + esc(e.fio) + ' · ' + esc(e.status) + '"></i>';
    }).join('') + '</div>' +
    '<div style="display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:11.5px;color:var(--ink3)">' +
      '<span><i style="display:inline-block;width:9px;height:9px;border-radius:3px;background:var(--red);margin-right:6px"></i>критические — ' + lv.crit + '</span>' +
      '<span><i style="display:inline-block;width:9px;height:9px;border-radius:3px;background:var(--amber);margin-right:6px"></i>высокие — ' + lv.high + '</span>' +
      '<span><i style="display:inline-block;width:9px;height:9px;border-radius:3px;background:var(--bronze);margin-right:6px"></i>средние — ' + lv.mid + '</span>' +
      '<span><i style="display:inline-block;width:9px;height:9px;border-radius:3px;background:var(--green);margin-right:6px"></i>низкие — ' + lv.low + '</span>' +
    '</div><div style="margin-top:8px;font-size:11.5px;color:var(--ink3)">показаны первые 120 досье · наведите курсор для имени</div>' +
    '</div></div>';
  h += '</div>';

  h += '<div class="grid g3" style="margin-bottom:14px">' +
    barBlock('Гражданство', byCit, emps.length, 'b') +
    barBlock('Правовой статус', bySt, emps.length, 'a') +
    barBlock('Объекты', byObj, emps.length, 'g') +
    '</div>';

  h += '<div class="grid g2">' +
    barBlock('Нагрузка на исполнителей', byAssignee, open.length, 'r') +
    barBlock('Типы открытых обязательств', byKind, open.length, 'b') +
    '</div>';
  return h;
}

  e.preventDefault();
  deferredPrompt = e;
  if(installBtn) installBtn.classList.add('on');
});
window.addEventListener('appinstalled', function(){
  if(installBtn) installBtn.classList.remove('on');
  toast('Приложение установлено', 'КадрГраница доступна в меню «Пуск»', 'ok');
});
ACTIONS.install = function(){
  if(deferredPrompt){
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(function(c){
      if(c.outcome === 'accepted') toast('Установка запущена', 'Ярлык появится в системе', 'ok');
      else toast('Установка отменена', 'Вернуться к ней можно в настройках', 'warn');
      deferredPrompt = null;
      if(installBtn) installBtn.classList.remove('on');
    });
    return;
  }
  ACTIONS.installHelp();
};
if('serviceWorker' in navigator && location.protocol.indexOf('http') === 0){
  navigator.serviceWorker.register('kg-sw.js').catch(function(){});
}

/* ───────── 7. ГОРЯЧИЕ КЛАВИШИ ───────── */
(function(){
  var gMode = false, gTimer = null;
  var MAP = {'1':'dash','2':'emps','3':'dead','4':'risk','5':'analytics','6':'log','7':'notif','8':'rules','9':'set'};
  document.addEventListener('keydown', function(e){
    var t = e.target, tag = (t.tagName || '').toLowerCase();
    if(tag === 'input' || tag === 'textarea' || tag === 'select' || t.isContentEditable) return;
    if(e.ctrlKey || e.metaKey || e.altKey) return;
    var k = e.key.toLowerCase();
    if(gMode && MAP[e.key]){ e.preventDefault(); gMode = false; go(MAP[e.key]); return; }
    if(k === 'g' || k === 'п'){ gMode = true; clearTimeout(gTimer); gTimer = setTimeout(function(){ gMode = false; }, 1400); return; }
    gMode = false;
    if(k === 'n' || k === 'т'){ e.preventDefault(); ACTIONS.quick(); }
    else if(e.key === '?' || k === '/'){ e.preventDefault(); ACTIONS.help(); }
  });
})();

/* ───────── 8. ПРИМЕНИТЬ СОХРАНЁННЫЕ НАСТРОЙКИ ───────── */
(function(){
  var th = DB.settings.theme;
  try{ th = localStorage.getItem(THEME_KEY) || th; }catch(e){}
  applyTheme(THEMES[th] ? th : 'graphite', true);
  var dn = DB.settings.dense;
  try{ var v = localStorage.getItem(DENSE_KEY); if(v !== null) dn = (v === '1'); }catch(e){}
  applyDense(!!dn, true);
  render();
})();
</script>
