  var h = '<div class="ph"><div><h1>Проверить штат</h1><div class="sub">Загрузите список сотрудников из Excel или 1С — за минуту получите отчёт: что нарушено, чем грозит и что сделать</div></div>' +
    '<div class="actions"><button class="btn o" data-act="auditTemplate">' + icon('download') + ' Скачать шаблон таблицы</button>' + (st > 1 ? '<button class="btn o" data-act="auditReset">Проверить другой файл</button>' : '') + '</div></div>';
  h += '<div class="funnel">' + [['1','Загрузите файл','Excel или CSV'],['2','Проверка таблицы','что заполнено с ошибками'],['3','Результат','нарушения и штрафы'],['4','План','что сделать за 7 / 30 / 90 дней']].map(function(s, i){
    return '<div class="fs' + (st > i+1 ? ' done' : st === i+1 ? ' on' : '') + '"><span>' + s[0] + '</span><b>' + s[1] + '</b><i>' + s[2] + '</i></div>'; }).join('') + '</div>';
  if(st === 1){
    h += '<div class="grid g2"><div class="card"><div class="pt"><b>Загрузите список сотрудников</b><span class="mono">.csv · .xlsx</span></div><div class="pb">' +
      '<label class="drop" for="audit-file"><b>Перетащите файл сюда или выберите</b><span>Подойдёт таблица по шаблону: ФИО, статус, дата приёма, патент, регистрация… Скачайте шаблон кнопкой справа вверху.</span><input type="file" id="audit-file" accept=".csv,.txt,.xlsx,.xls"></label>' +
      '<button class="swrow" data-act="auditAnon"><div class="tx"><b>Обезличенный режим</b><span>ФИО заменяются кодами «Работник-01…» — так безопаснее для первого аудита по 152-ФЗ</span></div><span class="sw' + (a.anon?' on':'') + '"></span></button>' +
      '<div class="btnrow"><button class="btn t" data-act="auditSample">' + icon('play') + ' Попробовать на примере (25 сотрудников)</button></div>' +
      '<div class="hint2">Пример — вымышленный склад с типичными ошибками: забытое уведомление, просроченный чек, патент другого региона.</div></div></div>' +
      '<div class="card"><div class="pt"><b>Что мы проверим</b><span class="mono">' + RULE_ORDER.filter(function(r){ return ruleActive(r) && r !== 'R-13' && r !== 'R-14'; }).length + ' правил</span></div><div>' +
      RULE_ORDER.filter(function(r){ return ruleActive(r) && r !== 'R-13' && r !== 'R-14'; }).map(function(r){ return '<div class="row"><span class="pill tea">' + r + '</span><div class="tx"><b>' + esc(Q.rule(r).title) + '</b><span>' + esc(RULE_META[r].basis) + '</span></div></div>'; }).join('') +
      '<div class="pb hint2">Сканы документов и реестры МВД проверяются в полном аудите (10 рабочих дней).</div></div></div></div>';
    return h;
  }
  var b = a.built, r = a.result;
  if(st === 2){
    h += '<div class="card" style="margin-bottom:14px"><div class="pt"><b>Файл: ' + esc(a.fileName) + '</b><span class="mono">' + b.emps.length + ' строк · ' + b.objects.length + ' объект(а)</span></div><div class="pb">' +
      '<div class="grid g3 tight">' + metric('Строк распознано', String(b.emps.length), 'работников в выгрузке') + metric('Строк с проблемами данных', String(b.issues.length), 'не мешают аудиту, но требуют уточнения') +
      metric('Колонок узнано', String(a.cols) + ' из ' + AUDIT_COLS.length, 'по заголовкам') + '</div>';
    if(b.issues.length){
      h += sectionLabel('Что в таблице заполнено с ошибками') + '<div class="tw"><table class="tbl"><thead><tr><th>Строка</th><th>Работник</th><th>Что не так</th></tr></thead><tbody>' +
        b.issues.map(function(x){ return '<tr><td class="mono">' + x.row + '</td><td>' + esc(x.fio) + '</td><td>' + esc(x.list.join('; ')) + '</td></tr>'; }).join('') + '</tbody></table></div>';
    } else h += '<div class="okbox">✓ Выгрузка чистая: все обязательные поля заполнены, даты распознаны.</div>';
    h += '<div class="btnrow"><button class="btn o" data-act="auditReset">← Другой файл</button><button class="btn t" data-act="auditRun">Показать результат →</button></div></div></div>';
    h += '<div class="card"><div class="pt"><b>Предпросмотр</b><span class="mono">первые 8 строк</span></div><div class="tw"><table class="tbl"><thead><tr><th>ФИО</th><th>Статус</th><th>Объект</th><th>Приём</th><th>Уведомление</th><th>Документ</th></tr></thead><tbody>' +
      b.emps.slice(0, 8).map(function(e){ var n = b.notifs.filter(function(x){ return x.empId === e.id && x.kind === 'hire'; })[0];
        return '<tr><td>' + esc(e.fio) + '</td><td><span class="pill tea">' + esc(e.status) + '</span></td><td>' + esc((b.objects.filter(function(o){ return o.id === e.objectId; })[0]||{}).name) + '</td><td class="mono">' + dmy(e.hiredAt) + '</td><td class="mono">' + (n ? dmy(n.sentAt) + (n.status === 'confirmed' ? ' ✓' : ' · без квит.') : '—') + '</td><td class="mono">' + esc(e.patent ? e.patent.no : e.permit ? e.permit.no : '—') + '</td></tr>'; }).join('') +
      '</tbody></table></div></div>';
    return h;
  }
  /* результат */
  h += '<div class="grid g5" style="margin-bottom:14px">' +
    '<div class="kpi"><div class="l">Проверено работников</div><div class="n">' + b.emps.length + '</div><div class="s nt">' + esc(a.fileName) + '</div></div>' +
    '<div class="kpi red"><div class="l">С нарушениями</div><div class="n">' + r.withViol + '</div><div class="s dn">' + Math.round(r.withViol / Math.max(1,b.emps.length) * 100) + '% штата</div></div>' +
    '<div class="kpi red"><div class="l">Критических</div><div class="n">' + r.plan.d7.length + '</div><div class="s dn">закрыть за 7 дней</div></div>' +
    '<div class="kpi red"><div class="l">Диапазон санкций</div><div class="n sm">' + (r.ex.max ? rangeStr(r.ex.min, r.ex.max) : '0 ₽') + '</div><div class="s nt">min–max по КоАП, не прогноз</div></div>' +
    '<div class="kpi amb"><div class="l">Сроки на 30 дней</div><div class="n">' + r.dl.length + '</div><div class="s nt">уже идут</div></div></div>';
  h += '<div class="grid g21"><div class="card"><div class="pt"><b>Что нашли</b><span class="mono">' + r.viol.length + ' нарушений · ' + r.dl.length + ' сроков</span></div><div>';
  r.items.forEach(function(i){
    var e = b.emps.filter(function(x){ return x.id === i.empId; })[0];
    h += '<div class="row">' + sevPill(i.severity, i.type) + '<div class="tx"><b>' + esc(i.title) + '</b><span>' + esc(e.fio) + ' · строка ' + e.row + ' · ' + esc(i.why) + '</span></div>' + ruleChip(i.ruleId, i.ruleV) +
      (i.sanction ? '<span class="mono" style="white-space:nowrap">' + rangeStr(i.sanction.min, i.sanction.max) + '</span>' : '') + '</div>';
  });
  h += '</div></div><div><div class="card" style="margin-bottom:14px"><div class="pt"><b>План исправления</b></div><div class="pb">' +
    planBlock('За 7 дней · критическое', r.plan.d7, 'red') + planBlock('За 30 дней · высокое', r.plan.d30, 'amb') + planBlock('За 90 дней · остальное', r.plan.d90, 'blu') +
    '</div></div><div class="card"><div class="pt"><b>Что дальше</b></div><div class="pb">' +
    '<div class="btnrow col"><button class="btn t" data-act="auditReport">' + icon('download') + ' Отчёт (печать / PDF)</button><button class="btn o" data-act="auditCSV">' + icon('download') + ' Список в Excel</button>' +
    '<button class="btn o" data-act="auditAdopt">Взять этих сотрудников на контроль →</button></div>' +
    '<div class="hint2">Сотрудники появятся в системе, нарушения станут задачами с ответственными, а новые сроки система будет отслеживать сама.</div></div></div></div></div>';
  return h;
};
function planBlock(t, list, c){
  var by = {}; list.forEach(function(i){ by[i.title] = (by[i.title]||0) + 1; });
  return '<div class="plan"><div class="ph2"><span class="pill ' + c + '">' + list.length + '</span><b>' + t + '</b></div>' +
    (Object.keys(by).length ? Object.keys(by).map(function(k){ return '<div class="pl">' + esc(k) + (by[k] > 1 ? ' × ' + by[k] : '') + '</div>'; }).join('') : '<div class="pl muted">нет</div>') + '</div>';
}

function isDarkTheme(){ var t = THEMES[DB && DB.settings ? DB.settings.theme : 'dark']; return !!(t && t.dark); }
function applyTheme(k){
  if(!THEMES[k]) k = 'dark';
  var t = THEMES[k], r = document.documentElement;
  Object.keys(t.v).forEach(function(v){ r.style.setProperty(v, t.v[v]); });
  r.style.colorScheme = t.dark ? 'dark' : 'light';
  var meta = document.querySelector('meta[name="theme-color"]'); if(meta) meta.setAttribute('content', t.v['--graphite']);
  DB.settings.theme = k;
}

/* ═══════════════════════════════════════════════════════════════════════════
   Сценарии изменения данных: исправления, события, досье, документы, задачи.
   Любое изменение → запись в журнал → повторная проверка правилами → перерисовка.
   ═══════════════════════════════════════════════════════════════════════════ */
function commit(msg, opt){
  var r = reconcile(opt || {});
  saveDB(); render();
  if(r.gone.length) toast('Нарушение устранено', r.gone.map(function(g){ return g.title; }).join('; ') + ' · подтверждено повторной проверкой', 'ok');
  else if(msg) toast(msg[0], msg[1], msg[2] || 'ok');
  if(r.gone.length) demoFlag('fix');
  queueAfterCommit();
  return r;
}
function fileField(id, hint){
  return '<div class="fld"><label>Файл-подтверждение</label><input type="file" id="' + id + '" accept="image/*,.pdf,.doc,.docx,.xlsx">' +
    '<div class="hint">' + esc(hint || 'Можно оставить пустым — прототип создаст демо-скан, чтобы показать цепочку «файл → хэш → журнал».') + '</div></div>';
}
function makeDemoScan(type, title, lines){
  var L = [title].concat(lines || []);
  var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="595" height="420" viewBox="0 0 595 420"><rect width="595" height="420" fill="#fbf8f1"/>' +
    '<rect x="18" y="18" width="559" height="384" fill="none" stroke="#c8a24e" stroke-width="2" stroke-dasharray="6 5"/>' +
    '<text x="40" y="62" font-family="Arial" font-size="13" fill="#a9853b" letter-spacing="2">' + esc(String(type).toUpperCase()) + ' · ДЕМО-СКАН</text>' +
    L.map(function(t, i){ return '<text x="40" y="' + (102 + i*30) + '" font-family="Arial" font-size="' + (i===0?18:14) + '" fill="#241a10"' + (i===0?' font-weight="bold"':'') + '>' + esc(t) + '</text>'; }).join('') +
    '<text x="40" y="380" font-family="Arial" font-size="11" fill="#8a7b64">Сформировано КадрГраницей ' + dmy(iso(TODAY)) + ' · вымышленные данные</text>' +
    '<circle cx="505" cy="335" r="40" fill="none" stroke="#c64b2f" stroke-width="2"/><text x="505" y="340" text-anchor="middle" font-family="Arial" font-size="11" fill="#c64b2f">ПОЛУЧЕНО</text></svg>';
  return new Blob([svg], {type:'image/svg+xml'});
}
/* создаёт запись документа; файл — выбранный пользователем или демо-скан */
function saveDoc(inputId, meta){
  var inp = inputId ? $('#' + inputId) : null, f = inp && inp.files && inp.files[0];
  var blob = f || makeDemoScan(meta.type, meta.name, meta.lines);
  var id = 'D' + Date.now().toString(36).slice(-6) + (DB.documents.length + 1);
  var d = { id:id, empId:meta.empId || null, objectId:meta.objectId || null, contractorId:meta.contractorId || null, type:meta.type,
    name: f ? f.name : meta.name, size:fmtSize(blob.size), mime:blob.type || 'application/octet-stream', at:iso(TODAY), by:Q.user().name, fileKey:id, hash:null, demoScan:!f };
  return hashBlob(blob).then(function(h){
    d.hash = h; DB.documents.push(d);
    return FileStore.put(id, blob).then(function(){ return d; });
  });
}

function saveEmp(id){
  var fio = val('n-fio'), pass = val('n-pass');
  var ok = req('n-fio', fio.split(' ').filter(Boolean).length >= 2) & req('n-pass', pass.length >= 5);
  if(!ok){ toast('Проверьте форму', 'ФИО (минимум фамилия и имя) и номер паспорта обязательны', 'err'); return; }
  var st = val('n-st'), isNew = !id, e = isNew ? null : Q.emp(id), before = e ? JSON.stringify(e) : null;
  if(isNew){
    var n = DB.employees.length + 1;
    e = { id:'E' + (n < 100 ? '0' : '') + n + Date.now().toString(36).slice(-2), contractorId:null, firedAt:null, registry:{at:null, result:'clean', source:'эмуляция'}, suspended:false, phone:'—', medTo:T(300), vksDone:null };
  }
  e.fio = fio; e.citizenship = val('n-cit'); e.status = st; e.position = val('n-pos') || 'разнорабочий'; e.objectId = val('n-obj');
  e.hiredAt = val('n-hired') || iso(TODAY); e.contractNo = val('n-contract'); e.passportNo = pass; e.passportTo = val('n-passto');
  e.regTo = val('n-reg'); e.regByEmployer = val('n-host') === '1';
  e.patent = st === 'Патент' ? { no:val('n-patno') || '—', region:val('n-patreg'), profession:val('n-patprof') || e.position, issuedAt:val('n-patiss'), paidTo:val('n-paid') } : null;
  e.dmsTo = st === 'Патент' ? val('n-dms') : (e.dmsTo || null);
  e.permit = (st === 'Виза' || st === 'ВКС') ? { kind:st === 'ВКС' ? 'ВКС' : 'РНР', no:val('n-permno') || '—', region:Q.obj(e.objectId).region, validTo:val('n-permto') } : null;
  e.rp = (st === 'ВНЖ' || st === 'РВП') ? { kind:st, no:val('n-rpno') || '—', validTo:val('n-rpto') } : null;
  if(st === 'ВКС' && !e.vksDone) e.vksDone = lastQuarter(TODAY).key;
  if(isNew){
    DB.employees.unshift(e);
    logJ('emp', 'Принят на работу: ' + e.fio + ' (' + e.status + ', ' + e.position + '), объект «' + objName(e.objectId) + '», договор ' + e.contractNo + ' от ' + dmy(e.hiredAt), {empId:e.id});

function auditFile(file){
  var name = file.name;
  var done = function(table){
    var rows = rowsFromTable(table);
    if(!rows.length){ toast('Не удалось распознать строки', 'Проверьте заголовки: «ФИО», «Статус», «Дата приёма»… Скачайте шаблон.', 'err'); return; }
    var cols = table[0].filter(function(h){ return AUDIT_ALIASES[String(h).toLowerCase().trim()]; }).length;
    auditLoadRows(rows, name, cols);
    toast('Файл разобран', rows.length + ' строк · ' + cols + ' колонок узнано', 'ok');
  };
  if(/\.xlsx?$/i.test(name)){
    busy('Загрузка модуля Excel…', 500).then(function(){
      loadXLSX().then(function(X){
        readFileBuffer(file).then(function(buf){
          var wb = X.read(buf, {type:'array', cellDates:false, raw:false});
          var sh = wb.Sheets[wb.SheetNames[0]];
          done(X.utils.sheet_to_json(sh, {header:1, raw:false, defval:''}));
        });
      }, function(){ toast('Нет доступа к модулю Excel', 'Без интернета сохраните файл как CSV (разделитель «;») и загрузите снова', 'err'); });
    });
  } else readFileText(file).then(function(t){ done(parseCSV(t)); });
}

/* ═══════════ Разбор по очереди: дела открываются одно за другим ═══════════ */
function startQueue(keys, title){
  keys = keys.filter(function(k){ return ITEM_BY[k] && ITEM_BY[k].fix; });
  if(!keys.length){ toast('Разбирать нечего', 'Все дела здесь уже закрыты', 'ok'); return; }
  state.queue = { keys:keys, i:0, title:title, done:0, cur:null };
  queueOpen();
}
function queueOpen(){
  var q = state.queue; if(!q) return;
  while(q.i < q.keys.length && !ITEM_BY[q.keys[q.i]]) q.i++;
  if(q.i >= q.keys.length){
    var n = q.done; state.queue = null; renderQueue();
    toast('Разбор завершён', n ? 'Закрыто ' + n + ' ' + plural(n,'дело','дела','дел') + ' · всё записано в журнал' : 'Открытых дел в очереди не осталось', 'ok');
    return;
  }
  q.cur = q.keys[q.i];
  renderQueue();
  startFix(q.cur);
}
function queueAfterCommit(){
  var q = state.queue; if(!q || !q.cur || ITEM_BY[q.cur]) return;
  q.done++; q.i++; q.cur = null; renderQueue();
  (function tick(){ setTimeout(function(){ if(!state.queue) return; if(modalOpen() || paletteOpen() || state.wiz) return tick(); queueOpen(); }, 700); })();
}
function renderQueue(){
  var bar = $('#qbar'); if(!bar) return;
  var q = state.queue;
  document.body.classList.toggle('q-on', !!q);
  if(!q){ bar.className = ''; bar.innerHTML = ''; return; }
  var it = q.cur ? ITEM_BY[q.cur] : null, pos = Math.min(q.i + 1, q.keys.length);
  bar.className = 'on';
  bar.innerHTML = '<div class="qt"><b>' + esc(it ? it.title + (it.empId ? ' — ' + shortFio(Q.emp(it.empId).fio) : '') : 'Готовлю следующее дело…') + '</b><span>' + esc(q.title) + ' · ' + pos + ' из ' + q.keys.length + (q.done ? ' · закрыто ' + q.done : '') + '</span></div>' +
    '<span class="qp"><i style="width:' + Math.round(q.i / q.keys.length * 100) + '%"></i></span>' +
    (it ? '<button class="btn t sm" data-act="queueOpenCur">Открыть</button>' : '') +
    '<button class="btn o sm" data-act="queueSkip">Пропустить</button><button class="btn o sm" data-act="queueStop" aria-label="Завершить разбор">' + icon('x', 'sm') + '</button>';
}
Object.assign(ACTIONS, {
  palette:function(){ openPalette(''); },
  quick:function(){ openPalette(''); },
  themeToggle:function(){
    var dark = isDarkTheme();
    if(!dark) DB.settings.lightTheme = DB.settings.theme;
    applyTheme(dark ? (DB.settings.lightTheme && !THEMES[DB.settings.lightTheme].dark ? DB.settings.lightTheme : 'graphite') : 'dark');
    state.userMenu = false; saveDB(); render();
  },
  calJump:function(v){ state.taskView = 'cal'; state.calDay = v; var d = parseISO(v); state.calYear = d.getFullYear(); state.calMonth = d.getMonth(); state.group = null; go('tasks'); },
  queueStart:function(v){
    var list = v === 'urgent' ? M.crit().concat(deadlines().filter(function(i){ return daysLeft(i.due) <= 3; }))
      : ITEMS.filter(function(i){ return i.type === 'violation' || daysLeft(i.dueEff) <= 7; });
    startQueue(queueKeys(list), v === 'urgent' ? 'Срочное' : 'Всё, что требует внимания');
  },
  queueGroup:function(v){
    var g = GROUPS.filter(function(x){ return x.k === v; })[0]; if(!g) return;
    var list = ITEMS.filter(function(i){ return groupOf(i) === g && (i.type === 'violation' || daysLeft(i.dueEff) <= 7); });
    if(!list.length) list = ITEMS.filter(function(i){ return groupOf(i) === g; });
    startQueue(queueKeys(list), g.t);
  },
  queueEmp:function(v){ startQueue(queueKeys(itemsFor(v)), 'Дела сотрудника ' + shortFio(Q.emp(v).fio)); },
  queueViol:function(){ startQueue(queueKeys(filteredViol()), 'Нарушения'); },
  queueOpenCur:function(){ if(state.queue && state.queue.cur) startFix(state.queue.cur); },
  queueSkip:function(){ var q = state.queue; if(!q) return; closeModal(); q.i++; q.cur = null; queueOpen(); },
  queueStop:function(){ var n = state.queue ? state.queue.done : 0; state.queue = null; renderQueue(); toast('Разбор остановлен', n ? 'Закрыто ' + n + ' ' + plural(n,'дело','дела','дел') : 'Можно продолжить в любой момент', 'ok'); }
});

function runAct(raw, ev){
  var i = raw.indexOf(':');
  var key = i < 0 ? raw : raw.slice(0, i), v = i < 0 ? null : raw.slice(i + 1);
  var fn = ACTIONS[key];
  if(typeof fn === 'function'){
    try{ fn(v, ev); }
    catch(err){ console.error(err); toast('Не получилось', String(err && err.message || err), 'err'); }
    return;
  }
  toast('Действие не подключено', raw, 'warn');
}
document.addEventListener('click', function(ev){
  if(ev.target.id === 'overlay'){ closeModal(); return; }
  if(ev.target.id === 'cmdk'){ closePalette(); return; }
  if(document.body.classList.contains('sb-open') && !ev.target.closest('.sb') && !ev.target.closest('[data-act="menu"]')){ closeSidebarMobile(); }
  var po = ev.target.closest && ev.target.closest('#cmdk .po');
  if(po){ ev.preventDefault(); palRun(+po.getAttribute('data-pi')); return; }
  if(state.bell && !ev.target.closest('#belldd') && !ev.target.closest('[data-act="bell"]')){ state.bell = false; renderBell(); }
  if(state.userMenu && !ev.target.closest('.usr-wrap')){ state.userMenu = false; renderSidebar(); }
  var node = ev.target.closest ? ev.target.closest('[data-act]') : null;
  if(!node) return;
  if(node.tagName === 'LABEL') return;
  ev.preventDefault(); ev.stopPropagation();
  runAct(node.getAttribute('data-act'), ev);
}, false);
document.addEventListener('mousemove', function(ev){
  var po = ev.target.closest && ev.target.closest('#cmdk .po'); if(!po) return;
  var n = +po.getAttribute('data-pi'); if(n !== PAL.i){ PAL.i = n; $$('#cmdl .po').forEach(function(b){ b.classList.toggle('on', b === po); }); }
});

document.addEventListener('input', function(ev){

});
document.addEventListener('change', function(ev){
  var t = ev.target;
  if(t.id === 'empobj'){ state.empObj = t.value; render(); }
  else if(t.id === 'empst'){ state.empSt = t.value; state.empLimit = 30; render(); }

  else if(t.id === 'calc-reg') calcUpdate();
  else if(t.id === 'audit-file' && t.files && t.files[0]) auditFile(t.files[0]);
  else if(t.id === 'restore-file' && t.files && t.files[0]){
    readFileText(t.files[0]).then(function(txt){
      try{ var p = JSON.parse(txt); if(p.version !== 2 || !p.employees) throw new Error('формат');
        DB = p; reconcile({initial:true}); saveNow(); render(); toast('Данные восстановлены', p.employees.length + ' досье', 'ok'); }
      catch(e){ toast('Файл не подходит', 'Нужна резервная копия КадрГраницы', 'err'); }
    });
  }
});
/* перетаскивание файла выгрузки */
document.addEventListener('dragover', function(ev){ var d = ev.target.closest && ev.target.closest('.drop'); if(d){ ev.preventDefault(); d.classList.add('over'); } });
document.addEventListener('dragleave', function(ev){ var d = ev.target.closest && ev.target.closest('.drop'); if(d) d.classList.remove('over'); });
document.addEventListener('drop', function(ev){ var d = ev.target.closest && ev.target.closest('.drop'); if(!d) return; ev.preventDefault(); d.classList.remove('over'); var f = ev.dataTransfer.files[0]; if(f) auditFile(f); });

document.addEventListener('keydown', function(ev){
  if(paletteOpen()){
    if(ev.key === 'Escape'){ ev.preventDefault(); closePalette(); return; }
    if(ev.key === 'ArrowDown'){ ev.preventDefault(); palMove(1); return; }
    if(ev.key === 'ArrowUp'){ ev.preventDefault(); palMove(-1); return; }
    if(ev.key === 'Enter'){ ev.preventDefault(); palRun(); return; }
  }
  if(ev.key === 'Escape'){
    if(modalOpen()){ closeModal(); return; }
    if(state.bell){ state.bell = false; renderBell(); return; }
    if(state.screen === 'emp'){ go('emps'); return; }
    if(state.screen === 'obj'){ go('objects'); return; }
  }
  if((ev.ctrlKey || ev.metaKey) && (ev.key === 'k' || ev.key === 'л' || ev.key === 'K' || ev.key === 'Л')){ ev.preventDefault(); paletteOpen() ? closePalette() : openPalette(''); }
  else if(ev.key === '/' && !/input|textarea|select/i.test(ev.target.tagName || '') && !modalOpen() && !paletteOpen()){ ev.preventDefault(); openPalette(''); }
});
(function(){
  var g = false, gt = null, MAP = {'1':'dash','2':'emps','3':'viol','4':'tasks','5':'journal','6':'rules','7':'audit','8':'objects','9':'settings'};
  document.addEventListener('keydown', function(e){
    var tag = (e.target.tagName || '').toLowerCase();
    if(tag === 'input' || tag === 'textarea' || tag === 'select' || e.ctrlKey || e.metaKey || e.altKey || modalOpen() || paletteOpen()) return;
    var k = e.key.toLowerCase();
    if(g && MAP[e.key]){ e.preventDefault(); g = false; go(MAP[e.key]); return; }
    if(k === 'g' || k === 'п'){ g = true; clearTimeout(gt); gt = setTimeout(function(){ g = false; }, 1400); return; }
    g = false;
    if(k === 'n' || k === 'т'){ e.preventDefault(); ACTIONS.quick(); }
    else if(k === 't' || k === 'е'){ e.preventDefault(); ACTIONS.themeToggle(); }
    else if(k === 'd' || k === 'в'){ e.preventDefault(); ACTIONS.demoToggle(); }
    else if(e.key === '?'){ e.preventDefault(); ACTIONS.help(); }
  });
})();

  {k:'trace', t:'Почему система так решила', d:'В карточке сотрудника — «Как система проверила»: по каждому правилу видно, какие данные проверены.', go:'trace:E004', btn:'Показать трассировку'},

}

  }, 400);
})();
