<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17100A">
<title>КадрГраница</title>
<meta name="description" content="КадрГраница — система доказуемого миграционного контроля работодателя: аудит, исправление, постоянный надзор, пакет доказательств. Рабочий прототип.">
<!--
  КадрГраница · рабочий прототип, интерфейс v3
  Один файл, открывается двойным щелчком — без сервера и установки.
  v3: основная тёмная тема «графит и золото» (T — светлая), командная палитра Ctrl+K,
  «Разобрать по очереди», лента сроков на 14 дней, индекс соответствия, шкалы сроков в карточке,
  карта риска, мобильная нижняя панель.
  Данные демонстрационные и хранятся только в этом браузере (localStorage + IndexedDB).
  Исходники: src/ в репозитории, сборка: python3 tools/build.py
-->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2317100A'/%3E%3Cg fill='none' stroke-width='7'%3E%3Cpath d='M36 11H13v42h23M24 22v24M24 34l14-13M24 34l14 14' stroke='%23FFFFFF'/%3E%3Cpath d='M45 11h8v13M53 40v13h-8' stroke='%23E2A85C'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ═══════════ ТОКЕНЫ (эталон — презентация КадрГраница) ═══════════ */
:root{
  --graphite:#17100A; --g2:#1E150C; --g3:#281B10; --g4:#3A2A1A; --g5:#4A3A24;
  --page:#EFEAE0; --card:#FBFAF7; --card2:#F5F1E7;
  --ink:#241A10; --ink2:#5C4F3D; --ink3:#8A7B64; --ink4:#A89E89;
  --line:#E0D6C0; --line2:#CBBEA3; --line3:#EDE6D6;
  --gold:#C8A24E; --gold-d:#A9853B; --gold-bg:#F0E7CF; --gold-lt:#E2A85C; --gold-on:#F0C485;
  --red:#C64B2F; --red-bg:#F7E5DA; --red-br:#EFC9B6;
  --amber:#C87A1B; --amber-bg:#F8EDD3; --amber-br:#EFDAAE;
  --green:#4E8C4A; --green-bg:#EAF0DE; --green-br:#CFDDBB;
  --bronze:#B5742C; --bronze-bg:#F4E7CF;
  --on-gold:#22180C; --green-tx:#3D6C3A; --amber-tx:#8F5A14; --red-tx:#94381F;
  --acc-rgb:200,162,78; --acc2-rgb:181,116,44; --bad-rgb:198,75,47;
  --shadow-rgb:23,16,10; --shadow2-rgb:36,26,16; --page-rgb:239,234,224;
  --fb:'Golos Text',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --fm:'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace;
  --sh:0 10px 28px -16px rgba(var(--shadow2-rgb),.3);
  --sh-md:0 16px 42px -20px rgba(var(--shadow2-rgb),.36);
  --sh-lg:0 34px 80px -30px rgba(var(--shadow-rgb),.46);
  --ring:0 0 0 3px rgba(var(--acc-rgb),.42);
  --e:cubic-bezier(.2,.65,.25,1);
  --sbw:242px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:var(--fb);background:var(--page);color:var(--ink2);font-size:14px;line-height:1.55;
  -webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:inherit;text-decoration:none}
svg{display:block}
h1,h2,h3,h4{color:var(--ink);letter-spacing:-.018em;line-height:1.2;font-weight:700}
::selection{background:var(--gold);color:var(--on-gold)}
.mono{font-family:var(--fm);font-variant-numeric:tabular-nums}
:focus-visible{outline:none;box-shadow:var(--ring);border-radius:8px}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:9px;border:3px solid var(--page)}
::-webkit-scrollbar-thumb:hover{background:var(--ink4)}

/* ═══════════ КАРКАС ═══════════ */
#app{display:flex;height:100%;overflow:hidden}
.sb{width:var(--sbw);flex-shrink:0;background:var(--graphite);display:flex;flex-direction:column;
  padding:16px 12px 12px;overflow-y:auto;position:relative;z-index:30}
.sb::-webkit-scrollbar-thumb{background:var(--g4);border-color:var(--graphite)}
.sb .logo{display:flex;align-items:center;gap:10px;color:#fff;font-weight:700;font-size:14.5px;
  padding:4px 10px 18px;letter-spacing:.005em}
.sb .logo svg{flex-shrink:0;transition:transform .3s var(--e)}
.sb .logo:hover svg{transform:rotate(-5deg) scale(1.07)}
.sb .sec{font-family:var(--fm);font-size:8.5px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;
  color:var(--g5);padding:16px 12px 7px}
.sb .it{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:9px;color:var(--ink4);
  font-size:13px;font-weight:500;width:100%;text-align:left;transition:background .16s var(--e),color .16s,transform .16s var(--e);position:relative}
.sb .it svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.sb .it:hover{background:rgba(255,255,255,.06);color:#E8DCC4}
.sb .it.act{background:rgba(var(--acc-rgb),.18);color:var(--gold-on);font-weight:600}
.sb .it.act::before{content:"";position:absolute;left:-12px;top:9px;bottom:9px;width:3px;background:var(--gold);border-radius:0 3px 3px 0}
.sb .it .bdg{margin-left:auto;font-family:var(--fm);font-size:9.5px;font-weight:700;background:var(--red);
  color:#fff;border-radius:8px;padding:1px 7px;min-width:22px;text-align:center}
.sb .it .bdg.a{background:var(--amber)}
.sb .usr{margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px 10px;border-top:1px solid rgba(255,255,255,.09);
  border-radius:0;transition:background .16s;cursor:pointer}
.sb .usr:hover{background:rgba(255,255,255,.05)}
.sb .usr .ua{width:34px;height:34px;border-radius:10px;background:var(--g3);color:var(--gold-on);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex-shrink:0}
.sb .usr b{display:block;color:#fff;font-size:12.5px;line-height:1.3}
.sb .usr span{font-size:10.5px;color:var(--g5)}
.sb .usr .cv{margin-left:auto;color:var(--g5);font-size:11px}

.main{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
.top{flex-shrink:0;display:flex;align-items:center;gap:12px;padding:11px 24px;background:rgba(var(--page-rgb),.92);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--line);position:relative;z-index:20}
.top .comp{display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:8px 14px;font-weight:600;color:var(--ink);font-size:13px;transition:border-color .16s,box-shadow .16s}
.top .comp:hover{border-color:var(--line2);box-shadow:var(--sh)}
.top .srch{flex:1;max-width:440px;display:flex;align-items:center;gap:9px;background:var(--card);
  border:1px solid var(--line);border-radius:10px;padding:8px 14px;transition:border-color .16s,box-shadow .16s}
.top .srch:focus-within{border-color:var(--gold);box-shadow:var(--ring)}
.top .srch input{border:none;outline:none;font-size:13px;width:100%;background:transparent;color:var(--ink)}
.top .demo{margin-left:auto;font-family:var(--fm);font-size:9px;letter-spacing:.12em;color:var(--amber);
  background:var(--amber-bg);border:1px solid var(--amber-br);border-radius:7px;padding:6px 11px;font-weight:600;white-space:nowrap}
.top .ic-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);
  display:flex;align-items:center;justify-content:center;position:relative;transition:border-color .16s,transform .16s var(--e)}
.top .ic-btn:hover{border-color:var(--line2);transform:translateY(-1px)}
.top .ic-btn i{position:absolute;top:7px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--red);font-style:normal;
  box-shadow:0 0 0 2px var(--card)}
.top .ic-btn i.hide{display:none}

#view{flex:1;overflow-y:auto;padding:22px 24px 60px;scroll-behavior:smooth}
.wrap{max-width:1300px;margin:0 auto;width:100%}
@media(max-width:1080px){
  :root{--sbw:66px}
  .sb .logo span,.sb .it span:not(.bdg),.sb .sec,.sb .usr div,.sb .usr .cv{display:none}
  .sb .it{justify-content:center}
  .sb .it .bdg{position:absolute;top:2px;right:2px;margin:0;font-size:8px;padding:0 4px;min-width:16px}
  .top .demo{display:none}
}
@media(max-width:760px){
  #view{padding:16px 14px 48px}
  .top{padding:10px 14px}
  .top .comp{max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
}

/* ═══════════ ТИПОВЫЕ БЛОКИ ═══════════ */
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.ph h1{font-size:22px;font-weight:800;letter-spacing:-.024em}
.ph .sub{font-size:12.5px;color:var(--ink3);margin-top:4px}
.ph .actions{display:flex;gap:9px;flex-wrap:wrap}
.crumb{display:flex;align-items:center;gap:8px;font-family:var(--fm);font-size:10px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink3);margin-bottom:10px}
.crumb button{color:var(--gold-d);font-family:inherit;font-size:inherit;letter-spacing:inherit;font-weight:600}
.crumb button:hover{text-decoration:underline}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:13px;
  padding:9px 17px;border-radius:10px;border:1px solid transparent;white-space:nowrap;
  transition:transform .16s var(--e),box-shadow .18s var(--e),background .16s,border-color .16s,color .16s}
.btn:active{transform:translateY(0) scale(.98)}
.btn.t{background:var(--gold);color:var(--on-gold)}
.btn.t:hover{background:var(--gold-d);color:#fff;transform:translateY(-2px);box-shadow:0 12px 26px -12px rgba(var(--acc-rgb),.65)}
.btn.p{background:var(--graphite);color:#fff}
.btn.p:hover{background:var(--g3);transform:translateY(-2px);box-shadow:var(--sh-md)}
.btn.o{background:var(--card);color:var(--ink);border-color:var(--line)}
.btn.o:hover{border-color:var(--gold);color:var(--gold-d);transform:translateY(-2px)}
.btn.d{background:var(--red-bg);color:var(--red);border-color:var(--red-br)}
.btn.d:hover{background:var(--red);color:#fff;transform:translateY(-2px)}
.btn.sm{padding:6px 12px;font-size:12px;border-radius:8px}
.btn.xs{padding:4px 9px;font-size:11px;border-radius:7px}
.btn[disabled]{opacity:.45;pointer-events:none}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh);overflow:hidden}
.card.flat{box-shadow:none}
.pt{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 17px;border-bottom:1px solid var(--line3)}
.pt b{font-size:13.5px;color:var(--ink);font-weight:700}
.pt .mono{font-size:9.5px;color:var(--ink3);letter-spacing:.1em;text-transform:uppercase}
.pb{padding:14px 17px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g21{grid-template-columns:1.45fr .95fr}
.g12{grid-template-columns:.95fr 1.45fr}
@media(max-width:1180px){.g4{grid-template-columns:repeat(2,1fr)}.g21,.g12{grid-template-columns:1fr}}
@media(max-width:820px){.g3,.g2{grid-template-columns:1fr}}
@media(max-width:560px){.g4{grid-template-columns:1fr}}

.kpi{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:15px 17px;box-shadow:var(--sh);
  transition:transform .22s var(--e),box-shadow .22s var(--e),border-color .22s;position:relative;overflow:hidden}
.kpi:hover{transform:translateY(-3px);box-shadow:var(--sh-md);border-color:var(--line2)}
.kpi .l{font-size:11px;color:var(--ink3);font-weight:500}
.kpi .n{font-family:var(--fm);font-size:25px;font-weight:700;color:var(--ink);margin-top:5px;letter-spacing:-.035em;line-height:1.1}
.kpi .n small{font-size:12px;color:var(--ink3);font-weight:600;letter-spacing:0}
.kpi .s{font-size:10.5px;font-weight:600;margin-top:4px}
.kpi .s.up{color:var(--green)} .kpi .s.dn{color:var(--red)} .kpi .s.nt{color:var(--ink3)}
.kpi.red .n{color:var(--red)} .kpi.grn .n{color:var(--green)} .kpi.amb .n{color:var(--amber)}
.kpi.clk{cursor:pointer}
.kpi.clk::after{content:"→";position:absolute;right:14px;top:14px;color:var(--ink4);font-size:13px;opacity:0;transition:opacity .2s,transform .2s var(--e)}
.kpi.clk:hover::after{opacity:1;transform:translateX(3px)}

.pill{display:inline-flex;align-items:center;gap:5px;font-family:var(--fm);font-size:9.5px;font-weight:600;
  letter-spacing:.05em;padding:3px 9px;border-radius:6px;white-space:nowrap;border:1px solid transparent}
.pill.red{background:var(--red-bg);color:var(--red);border-color:var(--red-br)}
.pill.amb{background:var(--amber-bg);color:var(--amber);border-color:var(--amber-br)}
.pill.grn{background:var(--green-bg);color:var(--green);border-color:var(--green-br)}
.pill.tea{background:var(--gold-bg);color:var(--gold-d);border-color:rgba(var(--acc-rgb),.34)}
.pill.blu{background:var(--bronze-bg);color:var(--bronze);border-color:rgba(var(--acc2-rgb),.28)}
.pill.gry{background:var(--page);color:var(--ink3);border-color:var(--line)}

.chips{display:flex;gap:8px;flex-wrap:wrap}
.ch{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 15px;font-size:12.5px;
  font-weight:600;color:var(--ink2);transition:all .16s var(--e)}
.ch:hover{border-color:var(--gold);color:var(--gold-d);transform:translateY(-1px)}
.ch.on{background:var(--graphite);border-color:var(--graphite);color:#fff}
.ch .c{font-family:var(--fm);font-size:10px;opacity:.65;margin-left:5px}

table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);
  text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);background:var(--card2);white-space:nowrap}
.tbl td{padding:11px 14px;border-bottom:1px solid var(--line3);color:var(--ink2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tr.clk{cursor:pointer;transition:background .14s}
.tbl tr.clk:hover{background:var(--gold-bg)}
.tbl .nm{font-weight:600;color:var(--ink)}
.tbl .mono{font-size:11px;color:var(--ink3)}
.ava{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--g2),var(--g3));color:var(--gold-on);
  display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;margin-right:10px;
  vertical-align:middle;flex-shrink:0;font-family:var(--fm)}
.ava.lg{width:52px;height:52px;border-radius:14px;font-size:16px;margin:0}

.row{display:flex;align-items:center;gap:12px;padding:11px 17px;border-bottom:1px solid var(--line3);transition:background .14s}
.row:last-child{border-bottom:none}
.row:hover{background:var(--gold-bg)}
.row .tx{flex:1;min-width:0}
.row .tx b{display:block;color:var(--ink);font-weight:600;font-size:13px;line-height:1.35}
.row .tx span{display:block;color:var(--ink3);font-size:11.5px;margin-top:2px}
.row.ov{background:var(--red-bg)}
.row.ov:hover{background:var(--red-br)}
.row.done .tx b{text-decoration:line-through;color:var(--ink3)}

.chk{width:19px;height:19px;border:1.8px solid var(--line2);border-radius:6px;flex-shrink:0;display:flex;
  align-items:center;justify-content:center;transition:all .16s var(--e);background:var(--card)}
.chk:hover{border-color:var(--green)}
.chk.on{background:var(--green);border-color:var(--green);color:#fff}
.chk svg{width:11px;height:11px;stroke:currentColor;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.chk.on svg{opacity:1}

.empty{padding:44px 20px;text-align:center;color:var(--ink3)}
.empty b{display:block;color:var(--ink);font-size:14px;margin-bottom:6px}
.lead{display:flex;align-items:center;gap:0;font-size:12.5px}
.lead .dots{flex:1;border-bottom:1px dotted var(--line2);margin:0 9px;transform:translateY(-3px)}

.kv{display:flex;align-items:baseline;gap:8px;padding:8px 0;border-bottom:1px dotted var(--line3);font-size:13px}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--ink3);flex-shrink:0}
.kv .v{margin-left:auto;font-weight:600;color:var(--ink);text-align:right;font-family:var(--fm);font-size:12px}
.kv .v.r{color:var(--red)} .kv .v.a{color:var(--amber)} .kv .v.g{color:var(--green)}

.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:5.5px;top:8px;bottom:8px;width:1.5px;background:var(--line2)}
.tl .ti{position:relative;padding:9px 0;font-size:12.5px;color:var(--ink2);line-height:1.5}
.tl .ti::before{content:"";position:absolute;left:-21.5px;top:14px;width:11px;height:11px;border-radius:50%;
  background:var(--card);border:2px solid var(--line2)}
.tl .ti.done::before{background:var(--green);border-color:var(--green)}
.tl .ti.next::before{background:var(--amber);border-color:var(--amber);box-shadow:0 0 0 4px var(--amber-bg)}
.tl .ti.crit::before{background:var(--red);border-color:var(--red);box-shadow:0 0 0 4px var(--red-bg)}
.tl .ti b{color:var(--ink);font-weight:600}
.tl .ti .md{font-family:var(--fm);font-size:10px;color:var(--ink3);display:block;margin-top:2px;letter-spacing:.04em}

.bar{height:7px;background:var(--line3);border-radius:7px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:7px;transition:width .8s var(--e)}
.bar i.r{background:var(--red)} .bar i.a{background:var(--amber)} .bar i.g{background:var(--green)} .bar i.b{background:var(--bronze)}

.donut{width:112px;height:112px;border-radius:50%;position:relative;flex-shrink:0}
.donut::after{content:"";position:absolute;inset:18px;background:var(--card);border-radius:50%}
.donut .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:2}
.donut .c b{font-family:var(--fm);font-size:20px;font-weight:700;color:var(--ink);line-height:1}
.donut .c span{font-size:9px;color:var(--ink3);margin-top:3px}
.legend{display:flex;flex-direction:column;gap:7px;font-size:11.5px;color:var(--ink2);flex:1}
.legend button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:3px 6px;border-radius:7px;
  transition:background .14s,transform .14s var(--e)}
.legend button:hover{background:var(--gold-bg);transform:translateX(2px)}
.legend i{width:9px;height:9px;border-radius:3px;flex-shrink:0;font-style:normal}
.legend b{margin-left:auto;font-family:var(--fm);font-weight:700;color:var(--ink)}

/* ═══════════ КАЛЕНДАРЬ ═══════════ */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .dh{font-family:var(--fm);font-size:9.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink3);text-align:center;padding:4px 0}
.cal .dc{background:var(--card2);border:1px solid transparent;border-radius:9px;min-height:78px;padding:6px 7px;
  text-align:left;transition:all .16s var(--e);position:relative;overflow:hidden}
.cal .dc:hover{border-color:var(--gold);transform:translateY(-2px);box-shadow:var(--sh)}
.cal .dc.out{opacity:.4}
.cal .dc.today{border-color:var(--gold-d);background:var(--gold-bg)}
.cal .dc.sel{border-color:var(--graphite);background:var(--card);box-shadow:var(--sh-md)}
.cal .dc .dn{font-family:var(--fm);font-size:11.5px;font-weight:700;color:var(--ink2)}
.cal .dc .ev{display:block;font-size:9px;border-radius:4px;padding:2px 5px;margin-top:3px;font-weight:600;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal .dc .ev.r{background:var(--red-bg);color:var(--red)}
.cal .dc .ev.a{background:var(--amber-bg);color:var(--amber)}
.cal .dc .ev.g{background:var(--green-bg);color:var(--green)}
.cal .dc .ev.t{background:var(--gold-bg);color:var(--gold-d)}
.cal-nav{display:flex;align-items:center;gap:8px}
.cal-nav button{width:32px;height:32px;border:1px solid var(--line);border-radius:9px;background:var(--card);
  display:flex;align-items:center;justify-content:center;transition:all .16s var(--e);color:var(--ink2)}
.cal-nav button:hover{border-color:var(--gold);color:var(--gold-d)}
.cal-nav .m{font-weight:700;color:var(--ink);min-width:150px;text-align:center;font-size:14px}

/* ═══════════ ВИЗАРД УВЕДОМЛЕНИЙ ═══════════ */
.wiz-steps{display:flex;gap:0;border-bottom:1px solid var(--line);background:var(--card2)}
.wiz-steps .ws{flex:1;padding:14px 16px;display:flex;align-items:center;gap:11px;position:relative;
  transition:background .18s;text-align:left}
.wiz-steps .ws:not(:last-child)::after{content:"";position:absolute;right:0;top:12px;bottom:12px;width:1px;background:var(--line)}
.wiz-steps .ws .no{width:26px;height:26px;border-radius:50%;background:var(--line3);color:var(--ink3);
  display:flex;align-items:center;justify-content:center;font-family:var(--fm);font-size:11px;font-weight:700;
  flex-shrink:0;transition:all .22s var(--e)}
.wiz-steps .ws .lb{font-size:12.5px;font-weight:600;color:var(--ink3);line-height:1.3}
.wiz-steps .ws.on{background:var(--card)}
.wiz-steps .ws.on .no{background:var(--gold);color:#22180C}
.wiz-steps .ws.on .lb{color:var(--ink)}
.wiz-steps .ws.done .no{background:var(--green);color:#fff}
.wiz-steps .ws.done .lb{color:var(--ink2)}
.wiz-steps .ws:hover:not(.on){background:var(--gold-bg)}
.wiz-body{padding:20px 20px 22px;animation:fadein .3s var(--e)}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.wiz-foot{display:flex;justify-content:space-between;gap:10px;padding:14px 20px;border-top:1px solid var(--line);
  background:var(--card2);flex-wrap:wrap}
.wiz-foot .rgt{display:flex;gap:9px;margin-left:auto;flex-wrap:wrap}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:9px;max-height:330px;overflow-y:auto;padding:2px}
.pick button{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);
  border-radius:11px;background:var(--card);text-align:left;transition:all .16s var(--e)}
.pick button:hover{border-color:var(--gold);transform:translateY(-2px);box-shadow:var(--sh)}
.pick button.on{border-color:var(--graphite);background:var(--gold-bg);box-shadow:var(--sh)}
.pick .nm{font-size:12.5px;font-weight:600;color:var(--ink);line-height:1.3}
.pick .ds{font-size:10.5px;color:var(--ink3);margin-top:2px}
.check{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-radius:10px;font-size:12.5px;
  line-height:1.45;margin-bottom:8px;border:1px solid transparent}
.check.ok{background:var(--green-bg);color:var(--green-tx);border-color:var(--green-br)}
.check.warn{background:var(--amber-bg);color:var(--amber-tx);border-color:var(--amber-br)}
.check.bad{background:var(--red-bg);color:var(--red-tx);border-color:var(--red-br)}
.check .ic{font-family:var(--fm);font-weight:700;flex-shrink:0}
.check b{font-weight:700}
.form-doc{background:var(--card);border:1px solid var(--line2);border-radius:10px;padding:20px 22px;font-size:12.5px;
  box-shadow:var(--sh);max-height:340px;overflow-y:auto}
.form-doc h4{font-size:13px;text-align:center;margin-bottom:4px;text-transform:uppercase;letter-spacing:.05em}
.form-doc .sb2{text-align:center;color:var(--ink3);font-size:10.5px;margin-bottom:16px;font-family:var(--fm)}
.form-doc .fl{display:flex;gap:10px;padding:7px 0;border-bottom:1px dotted var(--line2)}
.form-doc .fl .fk{color:var(--ink3);width:44%;flex-shrink:0;font-size:11.5px}
.form-doc .fl .fv{font-weight:600;color:var(--ink)}
.form-doc .sig{margin-top:18px;display:flex;justify-content:space-between;gap:20px;font-size:10.5px;color:var(--ink3)}
.form-doc .sig span{border-top:1px solid var(--line2);padding-top:5px;flex:1;text-align:center}

/* ═══════════ ФОРМЫ ═══════════ */
.fld{margin-bottom:13px}
.fld label{display:block;font-size:11.5px;font-weight:600;color:var(--ink2);margin-bottom:5px}
.fld input,.fld select,.fld textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 12px;
  background:var(--card);font-size:13px;color:var(--ink);transition:border-color .16s,box-shadow .16s;outline:none}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--gold);box-shadow:var(--ring)}
.fld input.err,.fld select.err{border-color:var(--red);box-shadow:0 0 0 3px rgba(var(--bad-rgb),.16)}
.fld .hint{font-size:10.5px;color:var(--ink3);margin-top:4px}
.fld .errmsg{font-size:11px;color:var(--red);margin-top:4px;font-weight:600;display:none}
.fld.bad .errmsg{display:block}
.fld textarea{resize:vertical;min-height:70px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.frow{grid-template-columns:1fr}}
.sw{width:42px;height:24px;border-radius:24px;background:var(--line2);position:relative;flex-shrink:0;transition:background .2s var(--e)}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;
  transition:transform .22s var(--e);box-shadow:0 2px 5px rgba(0,0,0,.22)}
.sw.on{background:var(--green)}
.sw.on::after{transform:translateX(18px)}
.swrow{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line3);width:100%;text-align:left}
.swrow:last-child{border-bottom:none}
.swrow .tx b{display:block;font-size:13px;color:var(--ink);font-weight:600}
.swrow .tx span{font-size:11.5px;color:var(--ink3)}
.swrow .tx{flex:1}

/* ═══════════ МОДАЛКИ ═══════════ */
#overlay{position:fixed;inset:0;background:rgba(var(--shadow-rgb),.62);backdrop-filter:blur(4px);z-index:400;
  display:none;align-items:center;justify-content:center;padding:24px;overflow-y:auto}
#overlay.on{display:flex;animation:ovin .22s var(--e)}
@keyframes ovin{from{opacity:0}to{opacity:1}}
.modal{background:var(--card);border-radius:16px;box-shadow:var(--sh-lg);width:100%;max-width:620px;
  max-height:88vh;display:flex;flex-direction:column;animation:mdin .3s var(--e);overflow:hidden}
.modal.wide{max-width:880px}
@keyframes mdin{from{opacity:0;transform:translateY(22px) scale(.97)}to{opacity:1;transform:none}}
.modal .mh{display:flex;align-items:center;gap:12px;padding:17px 20px;border-bottom:1px solid var(--line)}
.modal .mh b{font-size:15px;color:var(--ink);font-weight:700;flex:1}
.modal .mh .x{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);display:flex;align-items:center;
  justify-content:center;color:var(--ink3);font-size:15px;transition:all .16s var(--e)}
.modal .mh .x:hover{border-color:var(--red);color:var(--red);transform:rotate(90deg)}
.modal .mb{padding:20px;overflow-y:auto;flex:1}
.modal .mf{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:9px;justify-content:flex-end;
  background:var(--card2);flex-wrap:wrap}

/* ═══════════ ТОСТЫ ═══════════ */
#toasts{position:fixed;right:20px;bottom:20px;z-index:600;display:flex;flex-direction:column;gap:9px;
  max-width:calc(100vw - 40px);pointer-events:none}
.toast{display:flex;align-items:flex-start;gap:11px;background:var(--graphite);color:#EDE4D2;border-radius:12px;
  padding:13px 16px;box-shadow:var(--sh-lg);font-size:13px;line-height:1.45;min-width:260px;max-width:400px;
  animation:tin .34s var(--e);pointer-events:auto;border-left:3px solid var(--gold)}
.toast.ok{border-left-color:var(--green)}
.toast.warn{border-left-color:var(--amber)}
.toast.err{border-left-color:var(--red)}
.toast.out{animation:tout .3s var(--e) forwards}
.toast .ti{font-family:var(--fm);font-size:13px;flex-shrink:0;line-height:1.3}
.toast .tb b{display:block;color:#fff;font-weight:600;margin-bottom:2px}
.toast .tx2{color:#B8AC93;font-size:12px}
@keyframes tin{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
@keyframes tout{to{opacity:0;transform:translateX(30px)}}

/* ═══════════ ЗАГРУЗКА / ПРОГРЕСС ═══════════ */
#busy{position:fixed;inset:0;z-index:500;background:rgba(var(--shadow-rgb),.6);backdrop-filter:blur(4px);
  display:none;align-items:center;justify-content:center}
#busy.on{display:flex}
#busy .bx{background:var(--card);border-radius:16px;padding:26px 30px;box-shadow:var(--sh-lg);min-width:300px;text-align:center}
#busy .bx b{display:block;color:var(--ink);font-size:14px;margin-bottom:14px}
#busy .bar{height:5px}
#busy .pc{font-family:var(--fm);font-size:11px;color:var(--ink3);margin-top:9px}

/* ═══════════ ДРОПДАУНЫ ═══════════ */
.dd{position:absolute;top:calc(100% + 8px);right:0;background:var(--card);border:1px solid var(--line);
  border-radius:13px;box-shadow:var(--sh-lg);min-width:310px;max-width:380px;z-index:120;overflow:hidden;
  animation:mdin .22s var(--e);max-height:70vh;overflow-y:auto}
.dd .dh2{padding:12px 15px;border-bottom:1px solid var(--line3);font-size:12px;font-weight:700;color:var(--ink);
  display:flex;justify-content:space-between;align-items:center}
.dd .dh2 span{font-family:var(--fm);font-size:9.5px;color:var(--ink3);font-weight:500}
.dd .di{display:flex;gap:11px;padding:11px 15px;border-bottom:1px solid var(--line3);width:100%;text-align:left;
  transition:background .14s;align-items:flex-start}
.dd .di:last-child{border-bottom:none}
.dd .di:hover{background:var(--gold-bg)}
.dd .di .tx b{display:block;font-size:12.5px;color:var(--ink);font-weight:600;line-height:1.35}
.dd .di .tx span{font-size:11px;color:var(--ink3)}
.dd .df{padding:10px 15px;background:var(--card2);text-align:center}
.top .rel{position:relative}

/* ═══════════ ПЕЧАТЬ ОТЧЁТА ═══════════ */
#printarea{display:none}
@media print{
  body{overflow:visible;background:#fff}
  #app,#toasts,#busy,#overlay{display:none!important}
  #printarea{display:block!important;padding:26px;color:#000;font-size:12px}
  #printarea h1{font-size:20px;margin-bottom:4px}
  #printarea h2{font-size:14px;margin:18px 0 8px;border-bottom:1px solid #999;padding-bottom:4px}
  #printarea table{width:100%;border-collapse:collapse;font-size:11px}
  #printarea th,#printarea td{border:1px solid #999;padding:5px 7px;text-align:left}
}
@media(prefers-reduced-motion:reduce){
  *{animation-duration:.001ms!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
}
/* ─── переключатель палитры и плотности ─── */
.thgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.thcard{border:1px solid var(--line);border-radius:13px;padding:12px;background:var(--card);text-align:left;
  transition:transform .2s var(--e),box-shadow .2s var(--e),border-color .2s}
.thcard:hover{transform:translateY(-3px);box-shadow:var(--sh-md);border-color:var(--gold)}
.thcard.on{border-color:var(--gold);box-shadow:0 0 0 2px rgba(var(--acc-rgb),.28)}
.thcard .prev{height:44px;border-radius:9px;overflow:hidden;display:flex;margin-bottom:9px}
.thcard .prev i{flex:1;font-style:normal}
.thcard .prev i.s{flex:0 0 30%}
.thcard .nm{font-size:12.5px;font-weight:600;color:var(--ink);display:flex;align-items:center;gap:7px}
.thcard .nm .ck{margin-left:auto;color:var(--gold-d);font-family:var(--fm);font-size:11px;opacity:0}
.thcard.on .nm .ck{opacity:1}
/* плотность */
body.dense{font-size:13px}
body.dense .kpi{padding:11px 13px}
body.dense .kpi .n{font-size:21px}
body.dense .row{padding:8px 14px}
body.dense .pt{padding:11px 14px}
body.dense .pb{padding:11px 14px}
body.dense .tbl td{padding:8px 12px}
body.dense #view{padding:16px 18px 48px}
body.dense .ph{margin-bottom:14px}

/* ─── аналитика ─── */
.an-bars{display:flex;flex-direction:column;gap:11px}
.an-row{display:grid;grid-template-columns:minmax(96px,150px) minmax(0,1fr) 54px;gap:12px;align-items:center;font-size:12.5px}
.an-row .k2{color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.an-row .v2{font-family:var(--fm);font-weight:700;color:var(--ink);text-align:right;font-size:12px}
.spark{display:flex;align-items:flex-end;gap:5px;height:96px}
.spark .bb{flex:1;border-radius:5px 5px 0 0;background:linear-gradient(180deg,var(--gold),var(--gold-d));
  min-height:4px;position:relative;transition:height .7s var(--e)}
.spark .bb:hover{filter:brightness(1.12)}
.spark .bb span{position:absolute;top:-17px;left:50%;transform:translateX(-50%);font-family:var(--fm);
  font-size:9.5px;color:var(--ink3);white-space:nowrap}
.spark-x{display:flex;gap:5px;margin-top:7px}
.spark-x span{flex:1;text-align:center;font-family:var(--fm);font-size:8.5px;color:var(--ink3)}
.heat{display:grid;grid-template-columns:repeat(auto-fill,minmax(30px,1fr));gap:4px}
.heat i{aspect-ratio:1;border-radius:5px;font-style:normal;transition:transform .16s var(--e)}
.heat i:hover{transform:scale(1.16)}

/* ─── быстрые действия и хром ─── */
.qa{display:grid;gap:8px}
.qa button{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);
  border-radius:12px;background:var(--card);text-align:left;transition:all .18s var(--e)}
.qa button:hover{border-color:var(--gold);transform:translateX(4px);box-shadow:var(--sh)}
.qa .ic2{width:32px;height:32px;border-radius:9px;background:var(--gold-bg);color:var(--gold-d);
  display:flex;align-items:center;justify-content:center;font-family:var(--fm);font-size:14px;flex-shrink:0}
.qa b{display:block;font-size:13px;color:var(--ink)}
.qa span{display:block;font-size:11.5px;color:var(--ink3)}
.kbd{display:inline-flex;align-items:center;justify-content:center;min-width:22px;padding:2px 7px;
  border:1px solid var(--line2);border-radius:6px;background:var(--card2);font-family:var(--fm);
  font-size:10.5px;font-weight:600;color:var(--ink2)}
.kbdrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dotted var(--line3);font-size:12.5px}
.kbdrow:last-child{border-bottom:none}
.kbdrow .kk{display:flex;gap:5px;margin-left:auto}
#installBtn{display:none}
#installBtn.on{display:flex}

/* ═══════════ КадрГраница v2 · дополнительные компоненты ═══════════ */
.g5{grid-template-columns:repeat(5,1fr)}
@media(max-width:1280px){.g5{grid-template-columns:repeat(3,1fr)}}
@media(max-width:760px){.g5{grid-template-columns:repeat(2,1fr)}}
@media(max-width:480px){.g5{grid-template-columns:1fr}}
.grid.tight{gap:10px}
.kpi .n.sm{font-size:19px;line-height:1.25;padding-top:3px}
.kv .v{font-family:var(--fb);font-size:12.5px;max-width:64%}
.kv .k{max-width:46%}

.banner{display:flex;align-items:center;gap:14px;padding:13px 16px;border-radius:13px;margin-bottom:14px;border:1px solid var(--line);background:var(--card);flex-wrap:wrap}
.banner.amb{background:var(--amber-bg);border-color:var(--amber-br)}
.banner .tx{flex:1;min-width:240px}
.banner .tx b{display:block;color:var(--ink);font-size:13.5px}
.banner .tx span{display:block;font-size:12px;color:var(--ink2);margin-top:2px;line-height:1.5}
.pf{display:flex;gap:8px;padding:11px 17px;border-top:1px solid var(--line3);background:var(--card2);flex-wrap:wrap}
.pf.center{justify-content:center}
.mini-bar{width:80px;height:6px;border-radius:6px;background:var(--line3);overflow:hidden;flex-shrink:0}
.mini-bar i{display:block;height:100%;border-radius:6px}
.mini-bar i.g{background:var(--green)}.mini-bar i.a{background:var(--amber)}.mini-bar i.r{background:var(--red)}
.metric{border:1px solid var(--line3);border-radius:11px;padding:11px 13px;background:var(--card2)}
.metric .l{font-size:11px;color:var(--ink3);font-weight:500}
.metric .v{font-family:var(--fm);font-size:20px;font-weight:700;color:var(--ink);margin-top:3px;letter-spacing:-.03em}
.metric .s{font-size:10.5px;color:var(--ink3);margin-top:2px;line-height:1.4}

.toolbar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sel{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:12.5px;color:var(--ink);outline:none}
.sel:focus{border-color:var(--gold);box-shadow:var(--ring)}
.srch2{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 14px;min-width:220px}
.srch2 span{color:var(--ink3)}
.srch2 input{border:none;outline:none;background:transparent;font-size:12.5px;width:100%;color:var(--ink)}
.srch2:focus-within{border-color:var(--gold);box-shadow:var(--ring)}
.tw{overflow-x:auto}
.sub2{font-size:10px!important;color:var(--ink3);margin-top:2px}
.sub3{font-size:12px;color:var(--ink2)}
.pills{display:flex;gap:7px;flex-wrap:wrap;margin-top:7px}
.okbox{margin:14px 17px;padding:12px 14px;border-radius:10px;background:var(--green-bg);color:var(--green-tx);border:1px solid var(--green-br);font-size:12.5px;font-weight:600}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);padding:0 10px;background:var(--card2);overflow-x:auto}
.tabs button{padding:12px 13px;font-size:12.5px;font-weight:600;color:var(--ink3);border-bottom:2px solid transparent;white-space:nowrap;transition:color .15s,border-color .15s}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--ink);border-bottom-color:var(--gold)}
.reqdocs{display:flex;gap:6px;flex-wrap:wrap}
.hint2{font-size:11.5px;color:var(--ink3);line-height:1.6;margin-top:8px}
.bignum{font-family:var(--fm);font-size:24px;font-weight:700;letter-spacing:-.035em}
.bignum.r{color:var(--red)}.bignum.g{color:var(--green)}
.slabel{margin:16px 0 7px;font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3)}
.rchip{font-family:var(--fm);font-size:9.5px;font-weight:700;padding:3px 7px;border-radius:6px;border:1px solid var(--line2);color:var(--ink2);background:var(--card);white-space:nowrap;transition:all .15s}
.rchip:hover{border-color:var(--gold);color:var(--gold-d)}
.hash{font-family:var(--fm);font-size:9.5px;color:var(--ink3);background:var(--card2);border:1px solid var(--line3);border-radius:5px;padding:2px 6px;white-space:nowrap}
.row.it-row{cursor:pointer}
.row.selrow,.tbl tr.selrow{background:var(--gold-bg)}
.row{flex-wrap:wrap}
.row .tx{min-width:170px}
.row .tx span{overflow:hidden;text-overflow:ellipsis}
.row .btn{flex-shrink:0}
.row .pill{flex-shrink:0}
@media(min-width:1181px){.sticky-r{align-items:start}.sticky-r .side{position:sticky;top:0;max-height:calc(100vh - 110px);overflow-y:auto}}
.dtitle{font-size:15.5px;font-weight:700;color:var(--ink);line-height:1.35;margin-bottom:10px}
.who{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 11px;border:1px solid var(--line);border-radius:11px;background:var(--card2);margin:4px 0;transition:border-color .15s}
.who:hover{border-color:var(--gold)}
.who .ava{margin:0}

/* основная тёмная рабочая тема по умолчанию (светлые — в «Настройках» и клавишей T) */
:root{--graphite:#0A0704;--g2:#140E08;--g3:#1E150C;--g4:#2C2013;--g5:#3E2E1B;--page:#12100C;--card:#1B1710;--card2:#221D15;--ink:#F2ECDE;--ink2:#C5B99F;--ink3:#9B8F78;--ink4:#7C7160;--line:#2E2718;--line2:#443A26;--line3:#241E14;--gold:#D9B063;--gold-d:#E2A85C;--gold-bg:#2A2113;--gold-lt:#F0C485;--gold-on:#F5D9A8;--red:#E0705A;--red-bg:#2E1A14;--red-br:#4A2A20;--amber:#E0A33C;--amber-bg:#2C2211;--amber-br:#4A3A1C;--green:#7CBE6C;--green-bg:#182415;--green-br:#2A3D25;--bronze:#D08F4A;--bronze-bg:#2A2013;--on-gold:#1A1206;--green-tx:#9AD48B;--amber-tx:#EDBE68;--red-tx:#EE9683;--acc-rgb:217,176,99;--acc2-rgb:208,143,74;--bad-rgb:224,112,90;--shadow-rgb:0,0,0;--shadow2-rgb:0,0,0;--page-rgb:18,16,12}
/* ═══════════════════════════════════════════════════════════════════════════
   v3 · спокойный интерфейс
   Основная тёмная тема «графит и золото», светлая — переключателем,
   меньше моноширинного шрифта и капса, мягкие поверхности, SVG-иконки.
   ═══════════════════════════════════════════════════════════════════════════ */
:root{ --r:16px; --r-sm:11px;
  --sh:0 1px 2px rgba(var(--shadow2-rgb),.05),0 10px 26px -20px rgba(var(--shadow2-rgb),.32);
  --sh-md:0 2px 4px rgba(var(--shadow2-rgb),.05),0 18px 40px -22px rgba(var(--shadow2-rgb),.4); }
body{font-size:14px;letter-spacing:-.003em}
h1,h2,h3{text-wrap:balance}
.ic{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;display:inline-block;vertical-align:-3px}
.ic.sm{width:13px;height:13px;vertical-align:-2px}
.ic.lg{width:20px;height:20px}
.num{font-variant-numeric:tabular-nums;font-feature-settings:'tnum' 1}

/* поверхности */
.card{border-radius:var(--r);box-shadow:var(--sh);border-color:var(--line)}
.kpi{border-radius:var(--r);box-shadow:var(--sh);padding:16px 18px 15px}
.kpi .l{font-size:12px;font-weight:500}
.kpi .n{font-family:var(--fb);font-size:28px;font-weight:700;letter-spacing:-.035em;font-variant-numeric:tabular-nums;margin-top:6px}
.kpi .n small{font-size:14px;font-weight:600;color:var(--ink3);margin-left:1px}
.kpi .n.sm{font-size:21px}
.kpi .s{font-size:11.5px;font-weight:500;margin-top:5px}
.kpi.clk::after{content:"";width:7px;height:7px;border-top:1.7px solid var(--ink4);border-right:1.7px solid var(--ink4);transform:rotate(45deg);top:20px;right:18px}
.kpi.clk:hover::after{transform:translateX(3px) rotate(45deg)}
.pt{padding:15px 18px}
.pt b{font-size:14px}
.pt .mono{font-family:var(--fb);font-size:12px;letter-spacing:0;text-transform:none;font-weight:500;color:var(--ink3)}
.pb{padding:15px 18px}
.modal{border-radius:20px}
.modal .mh b{font-size:16px}
.ph h1{font-size:26px;letter-spacing:-.03em}
.ph .sub{font-size:13px;margin-top:5px}
.crumb{font-family:var(--fb);font-size:12.5px;letter-spacing:0;text-transform:none;margin-bottom:12px}
.crumb button{display:inline-flex;align-items:center;gap:4px}

/* метки — обычный шрифт, без капса; моноширинный только для кодов */
.pill{font-family:var(--fb);font-size:11.5px;letter-spacing:0;font-weight:600;padding:3px 10px;border-radius:999px}
.tag{font-size:11.5px;min-width:92px;padding:4px 11px}
.chain .lnk{text-decoration:none;color:inherit;font-size:inherit;font-weight:inherit}
.perm td:first-child{min-width:180px}
.sb .it span:not(.bdg){white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.rchip,.hash{font-family:var(--fm)}
.tbl th{text-transform:none;letter-spacing:0;font-size:12px;font-weight:600;padding:12px 16px;background:transparent}
.tbl td{padding:12px 16px}
.tbl tr.clk:hover{background:rgba(var(--acc-rgb),.08)}
.row:hover,.dd .di:hover{background:rgba(var(--acc-rgb),.08)}
.row{padding:12px 18px;gap:13px}
.slabel{letter-spacing:.08em;font-size:10.5px}
.ch{font-size:13px;padding:7px 15px;font-weight:600}
.ch .c{font-family:var(--fb);font-variant-numeric:tabular-nums;font-weight:600;opacity:.55}
.ch.on .c{opacity:.75}
.btn{border-radius:11px}
.btn .ic{width:15px;height:15px}
.btn.t{box-shadow:0 1px 0 rgba(255,255,255,.25) inset,0 6px 16px -10px rgba(var(--acc-rgb),.9)}
.ava{border-radius:10px;font-family:var(--fb);font-weight:700;font-size:11.5px}
.ava.c1{background:linear-gradient(135deg,#6B4F2A,#8A6A3A);color:#FBEED3}
.ava.c2{background:linear-gradient(135deg,#40513A,#5D7553);color:#E9F2DF}
.ava.c3{background:linear-gradient(135deg,#5A3A2E,#80513F);color:#FBE3D6}
.ava.c4{background:linear-gradient(135deg,#3B4656,#56657A);color:#E3EAF5}
.ava.c5{background:linear-gradient(135deg,#2B2118,#4A3A24);color:var(--gold-on)}
.empty{padding:40px 20px}
.empty .eic{width:46px;height:46px;border-radius:14px;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;background:var(--card2);border:1px solid var(--line);color:var(--ink3)}
.empty .eic .ic{width:22px;height:22px}
.empty.ok .eic{background:var(--green-bg);border-color:var(--green-br);color:var(--green)}
.okbox{display:flex;align-items:center;gap:10px}
.why{line-height:1.65}

/* сайдбар */
.sb{padding:18px 12px 12px;gap:0}
.sb .logo{padding:2px 8px 16px;gap:11px;align-items:center}
.sb .logo .lt{display:flex;flex-direction:column;line-height:1.15}
.sb .logo .lt small{font-size:10px;font-weight:500;color:var(--g5);letter-spacing:.02em;margin-top:2px}
.sb .it{padding:8px 12px;font-size:13.5px;border-radius:10px;gap:12px;color:#B4A68D}
.sb .it svg{width:17px;height:17px}
.sb .it .bdg{font-family:var(--fb);font-size:10.5px;border-radius:999px;padding:1px 7px}
.sb .sec{font-family:var(--fb);font-size:10.5px;letter-spacing:.08em;color:#6F5F47;padding:14px 12px 5px}
.sb .spacer{flex:1;min-height:16px}
.sb-cta{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;padding:13px 13px;border-radius:13px;margin-bottom:8px;
  background:linear-gradient(140deg,rgba(var(--acc-rgb),.22),rgba(var(--acc-rgb),.07));border:1px solid rgba(var(--acc-rgb),.3);transition:transform .2s var(--e),border-color .2s}
.sb-cta:hover{transform:translateY(-2px);border-color:rgba(var(--acc-rgb),.6)}
.sb-cta.act{border-color:var(--gold)}
.sb-cta .ic{color:var(--gold-on);width:18px;height:18px;margin-top:1px}
.sb-cta b{display:block;color:#fff;font-size:13px}
.sb-cta span{display:block;color:#B4A68D;font-size:11.5px;line-height:1.4;margin-top:2px}
@media(max-height:860px){.sb-cta span{display:none}.sb-cta{padding:10px 13px;align-items:center}.sb-cta .ic{margin-top:0}}
.sb-demo{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;border-radius:10px;color:#B4A68D;font-size:12.5px;font-weight:500;transition:background .16s}
.sb-demo:hover{background:rgba(255,255,255,.05);color:#E8DCC4}
.sb-demo .ring{width:22px;height:22px;flex-shrink:0}
.sb-demo b{margin-left:auto;font-weight:600;font-size:11.5px;color:var(--gold-on)}
.sb .usr span{color:#8C7C62}
.umenu .sep{height:1px;background:var(--g4);margin:4px 0}
.umenu .ic{color:var(--gold-on)}

/* верхняя панель */
.top{padding:12px 28px;gap:10px}
.top .srch-btn{flex:1;max-width:480px;display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:11px;
  padding:9px 12px 9px 14px;color:var(--ink3);font-size:13px;text-align:left;transition:border-color .16s,box-shadow .16s}
.top .srch-btn:hover{border-color:var(--line2);box-shadow:var(--sh)}
.top .srch-btn span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .srch-btn .kbd{flex:0 0 auto}
#cmdk input:focus-visible{box-shadow:none}
.top .flex{flex:1}
.top .demo{margin-left:0;font-family:var(--fb);font-size:11.5px;letter-spacing:0;padding:5px 11px;border-radius:999px;font-weight:600}
.top .ic-btn{color:var(--ink2)}
.top .ic-btn .ic{width:18px;height:18px}
.top .ic-btn i{top:8px;right:8px}
.kbd{font-family:var(--fb);font-size:11px}
#view{padding:26px 28px 70px}
.wrap.enter>*{animation:rise .42s var(--e) both}
.wrap.enter>*:nth-child(2){animation-delay:.03s}.wrap.enter>*:nth-child(3){animation-delay:.06s}
.wrap.enter>*:nth-child(4){animation-delay:.09s}.wrap.enter>*:nth-child(5){animation-delay:.12s}.wrap.enter>*:nth-child(n+6){animation-delay:.15s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* командная палитра */
#cmdk{position:fixed;inset:0;z-index:450;background:rgba(var(--shadow-rgb),.45);backdrop-filter:blur(3px);display:none;align-items:flex-start;justify-content:center;padding:12vh 16px 16px}
#cmdk.on{display:flex;animation:ovin .18s var(--e)}
#cmdk .box{width:100%;max-width:640px;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh-lg);overflow:hidden;animation:mdin .22s var(--e)}
#cmdk .in{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line3)}
#cmdk .in .ic{width:19px;height:19px;color:var(--ink3)}
#cmdk input{flex:1;border:none;outline:none;background:transparent;font-size:16px;color:var(--ink)}
#cmdk .list{max-height:56vh;overflow-y:auto;padding:6px}
#cmdk .grp{font-size:11px;font-weight:600;color:var(--ink3);padding:10px 12px 5px}
#cmdk .po{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:9px 12px;border-radius:11px;color:var(--ink)}
#cmdk .po .oi{width:30px;height:30px;border-radius:9px;background:var(--card2);border:1px solid var(--line3);display:flex;align-items:center;justify-content:center;color:var(--ink2);flex-shrink:0}
#cmdk .po .ava{margin:0;width:30px;height:30px}
#cmdk .po b{font-weight:600;font-size:13.5px;display:block;line-height:1.3}
#cmdk .po small{display:block;font-size:11.5px;color:var(--ink3);margin-top:1px}
#cmdk .po .tx{flex:1;min-width:0}
#cmdk .po .tx b,#cmdk .po .tx small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#cmdk .po.on{background:rgba(var(--acc-rgb),.14)}
#cmdk .po.on .oi{background:var(--gold);color:var(--on-gold);border-color:transparent}
#cmdk .po .ent{font-size:11px;color:var(--ink3);opacity:0}
#cmdk .po.on .ent{opacity:1}
#cmdk .ft{display:flex;gap:14px;padding:10px 16px;border-top:1px solid var(--line3);font-size:11.5px;color:var(--ink3);background:var(--card2)}
#cmdk .ft .kbd{margin-right:4px}

/* главная */
.hero{position:relative;overflow:hidden;border-radius:20px;padding:24px 26px 20px;margin-bottom:16px;color:#EFE6D3;
  background:radial-gradient(120% 140% at 100% 0%,rgba(var(--acc-rgb),.30),transparent 55%),linear-gradient(135deg,var(--graphite),var(--g3));
  box-shadow:var(--sh-md);border:1px solid rgba(var(--acc-rgb),.18)}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:260px;height:260px;border:34px solid rgba(var(--acc-rgb),.07);border-radius:50%;pointer-events:none}
.hero .hl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px 28px;align-items:end;position:relative;z-index:1}
.hero .hi{max-width:760px}
@media(max-width:1100px){.hero .hl{grid-template-columns:1fr}}
.hero .eyebrow{font-size:12px;color:#B9A884;font-weight:500}
.hero h2{color:#fff;font-size:26px;letter-spacing:-.03em;margin-top:6px;line-height:1.2}
.hero h2 em{font-style:normal;color:var(--gold-on)}
.hero p{font-size:13.5px;color:#CDBFA3;margin-top:8px;line-height:1.6;max-width:600px}
.hero .ha{display:flex;gap:8px;flex-direction:column;align-items:stretch;min-width:220px}
.hero .ha .btn{justify-content:flex-start}
@media(max-width:1100px){.hero .ha{flex-direction:row;flex-wrap:wrap;min-width:0}}
.hero .btn.o{background:rgba(255,255,255,.06);color:#F4EAD6;border-color:rgba(255,255,255,.16)}
.hero .btn.o:hover{border-color:var(--gold-on);color:#fff}
.week{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:6px;margin-top:22px;position:relative;z-index:1}
.week button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px 7px;border-radius:11px;border:1px solid rgba(255,255,255,.08);
  background:rgba(255,255,255,.035);color:#CDBFA3;transition:background .16s,transform .16s var(--e),border-color .16s;min-width:0}
.week button:hover{background:rgba(255,255,255,.09);transform:translateY(-2px)}
.week .wd{font-size:10.5px;text-transform:lowercase;opacity:.75}
.week .dd2{font-size:15px;font-weight:700;color:#fff;font-variant-numeric:tabular-nums}
.week .cnt{min-width:22px;height:18px;padding:0 6px;border-radius:9px;font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.06);color:#9C8D72}
.week .cnt.r{background:var(--red);color:#fff}.week .cnt.a{background:var(--amber);color:#1C1206}.week .cnt.t{background:rgba(var(--acc-rgb),.35);color:#fff}
.week .today{border-color:var(--gold);background:rgba(var(--acc-rgb),.14)}
.week .off{opacity:.55}
@media(max-width:900px){.week{grid-template-columns:repeat(7,minmax(0,1fr))}.week button:nth-child(n+8){display:none}}
.gauge{position:relative;width:64px;height:64px;flex-shrink:0}
.gauge svg{width:100%;height:100%;transform:rotate(-90deg)}
.gauge b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.kpi.gk{display:flex;gap:14px;align-items:center}
.kpi.gk .kt{flex:1;min-width:0}
.itile{width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--card2);color:var(--ink2);border:1px solid var(--line3)}
.itile .ic{width:18px;height:18px}
.itile.red{background:var(--red-bg);color:var(--red);border-color:var(--red-br)}
.itile.amb{background:var(--amber-bg);color:var(--amber);border-color:var(--amber-br)}
.itile.grn{background:var(--green-bg);color:var(--green);border-color:var(--green-br)}
.itile.gold{background:var(--gold-bg);color:var(--gold-d);border-color:rgba(var(--acc-rgb),.3)}
.cnt-b{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink);background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:2px 9px;flex-shrink:0}
.lawcard{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.lawcard .big{text-align:center;min-width:120px}
.lawcard .big b{display:block;font-size:34px;font-weight:800;letter-spacing:-.04em;color:var(--amber);line-height:1;font-variant-numeric:tabular-nums}
.lawcard .big span{font-size:11.5px;color:var(--ink3)}
.jrow .itile{width:30px;height:30px;border-radius:9px}
.jrow .itile .ic{width:15px;height:15px}
.hint-card{padding:13px 46px 13px 16px;border-radius:14px}
.hc-steps span{width:24px;height:24px;font-size:12px}
.hc-steps div{padding-left:34px}
.hc-steps b{font-size:13px}

/* карточка сотрудника */
.next{display:flex;gap:14px;align-items:center;padding:14px 16px;border-radius:14px;margin-bottom:16px;border:1px solid var(--line);background:var(--card);box-shadow:var(--sh);flex-wrap:wrap}
.next.red{border-color:var(--red-br);background:linear-gradient(90deg,var(--red-bg),var(--card) 70%)}
.next.amb{border-color:var(--amber-br);background:linear-gradient(90deg,var(--amber-bg),var(--card) 70%)}
.next.grn{border-color:var(--green-br);background:linear-gradient(90deg,var(--green-bg),var(--card) 70%)}
.next .tx{flex:1;min-width:220px}
.next .tx small{display:block;font-size:11.5px;color:var(--ink3);font-weight:600}
.next .tx b{display:block;font-size:15px;color:var(--ink);margin-top:2px}
.next .tx span{display:block;font-size:12.5px;color:var(--ink2);margin-top:3px;line-height:1.5}
.vl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px 10px;padding:10px 0;border-bottom:1px solid var(--line3);align-items:center}
.vl:last-child{border-bottom:none}
.vl .k{font-size:12.5px;color:var(--ink2)}
.vl .d{font-size:12px;font-weight:600;color:var(--ink);text-align:right;font-variant-numeric:tabular-nums}
.vl .d small{display:block;font-weight:500;font-size:11px;color:var(--ink3)}
.vl .d.r small{color:var(--red)}.vl .d.a small{color:var(--amber)}
.vl .bar{grid-column:1/-1;height:5px}
.lead{padding:7px 0;cursor:pointer}
.lead span:first-child{color:var(--ink2)}
.lead:hover span:first-child{color:var(--gold-d)}
.lead b{font-variant-numeric:tabular-nums;color:var(--ink);font-weight:600;white-space:nowrap}
.tabs.t2{background:transparent;padding:0 12px}
.tabs .tn{font-size:11px;font-weight:700;margin-left:5px;color:var(--ink3);background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:0 6px}

/* аналитика: карта риска */
.heat{grid-template-columns:repeat(auto-fill,minmax(18px,1fr));gap:4px}
.heat i{border-radius:5px;cursor:pointer}
.heat i:hover{transform:scale(1.25);box-shadow:0 0 0 2px var(--card),0 0 0 3px var(--ink3)}

/* разбор по очереди */
#qbar{position:fixed;left:calc(50% + var(--sbw)/2);bottom:22px;transform:translateX(-50%);z-index:440;display:none;align-items:center;gap:12px;
  background:var(--graphite);color:#EDE4D2;border-radius:16px;padding:10px 10px 10px 16px;box-shadow:var(--sh-lg);border:1px solid rgba(var(--acc-rgb),.3);max-width:calc(100vw - 24px)}
#qbar.on{display:flex;animation:rise .3s var(--e)}
#qbar .qt{font-size:12.5px;min-width:0}
#qbar .qt b{display:block;color:#fff;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:300px}
#qbar .qt span{color:#B8AC93}
#qbar .qp{width:120px;height:5px;border-radius:5px;background:rgba(255,255,255,.12);overflow:hidden;flex-shrink:0}
#qbar .qp i{display:block;height:100%;background:var(--gold);transition:width .4s var(--e)}
#qbar .btn.o{background:transparent;color:#EDE4D2;border-color:rgba(255,255,255,.2)}
#qbar .btn.o:hover{color:#fff;border-color:var(--gold-on)}
#overlay{z-index:430}
body.q-on #overlay{padding-bottom:96px}
body.q-on #toasts{bottom:96px}
@media(max-width:760px){#qbar{left:50%} body.q-on #toasts{bottom:150px}}

/* мобильная нижняя панель */
.bnav{display:none}
@media(max-width:760px){
  .bnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--card);border-top:1px solid var(--line);
    padding:6px 4px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -10px 30px -20px rgba(var(--shadow-rgb),.5)}
  .bnav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--ink3);padding:4px 0;position:relative}
  .bnav button .ic{width:20px;height:20px}
  .bnav button.on{color:var(--gold-d)}
  .bnav button i{position:absolute;top:0;left:calc(50% + 6px);background:var(--red);color:#fff;font-style:normal;font-size:9.5px;border-radius:999px;padding:0 5px;font-weight:700}
  #view{padding:18px 16px 96px}
  .top{padding:10px 14px}
  .top .demo,.top .srch-btn .kbd{display:none}
  .hero{padding:18px 18px 16px;border-radius:16px}
  .hero h2{font-size:21px}
  .ph h1{font-size:22px}
  #qbar{bottom:78px}
  #toasts{bottom:80px}
  .kpi .n{font-size:24px}
}
@media(max-width:1080px){ .sb-cta span,.sb-cta b,.sb-demo span,.sb-demo b,.sb .logo .lt{display:none} .sb-cta{justify-content:center;padding:11px} .sb-demo{justify-content:center} }
@media(max-width:760px){
  .sb-demo span,.sb-demo b{display:initial} .sb-cta b,.sb-cta span{display:block}
  body.sb-open .sb .logo .lt,.sb .logo .lt{display:flex} .sb .logo .lt small{display:block}
  .sb-cta,.sb-demo{justify-content:flex-start}
  .sb{z-index:80;width:272px}
  body.sb-open::before{content:"";position:fixed;inset:0;background:rgba(var(--shadow-rgb),.45);backdrop-filter:blur(2px);z-index:75;animation:ovin .2s var(--e)}
  .top .srch-btn{min-width:0}
}
.grid>*{min-width:0}
.bignum{font-family:var(--fb);font-variant-numeric:tabular-nums}
.ostats b{font-family:var(--fb);font-variant-numeric:tabular-nums}
.ofoot .mono{font-family:var(--fb);font-weight:600;color:var(--ink);font-size:13px}
.metric .v,.calcout b,.donut .c b,.legend b,.an-row .v2,.kv .v{font-family:var(--fb);font-variant-numeric:tabular-nums}
.wiz-steps .ws .no{font-family:var(--fb)}
.sanct b{font-family:var(--fb);font-size:17px}
.dtitle{font-size:18px;letter-spacing:-.02em}
.spark{margin-top:20px}

.spark-x span{font-family:var(--fb);font-size:10px}
.cal .dc .dn{font-family:var(--fb)}
.cal .dh{font-family:var(--fb);letter-spacing:.04em}
@media(max-width:560px){.g4{grid-template-columns:1fr 1fr}.kpi{padding:13px 14px}.kpi .n{font-size:22px}.kpi .n.sm{font-size:16px}.kpi.gk .gauge{display:none}.kpi .s{font-size:11px}}

      }

      H[4]=(H[4]+e)|0; H[5]=(H[5]+f)|0; H[6]=(H[6]+g)|0; H[7]=(H[7]+h)|0;
    }

function toCSV(headers, rows){
  var q = function(v){ v = v==null ? '' : String(v); return /[";\n\r]/.test(v) ? '"' + v.replace(/"/g,'""') + '"' : v; };
  return '﻿' + [headers.map(q).join(';')].concat(rows.map(function(r){ return r.map(q).join(';'); })).join('\r\n');
}
function parseCSV(text){
  text = String(text).replace(/^﻿/, '');
  var first = text.split(/\r?\n/)[0] || '';
  var delim = (first.split(';').length >= first.split(',').length) ? ';' : ',';
  if(first.split('\t').length > first.split(delim).length) delim = '\t';
  var rows = [], row = [], cur = '', inQ = false, i, ch;
  for(i=0;i<text.length;i++){
    ch = text[i];
    if(inQ){
      if(ch === '"'){ if(text[i+1] === '"'){ cur += '"'; i++; } else inQ = false; }
      else cur += ch;
    } else if(ch === '"') inQ = true;
    else if(ch === delim){ row.push(cur); cur = ''; }
    else if(ch === '\n' || ch === '\r'){
      if(ch === '\r' && text[i+1] === '\n') i++;
      row.push(cur); rows.push(row); row = []; cur = '';
    } else cur += ch;
  }
  if(cur !== '' || row.length){ row.push(cur); rows.push(row); }
  return rows.filter(function(r){ return r.some(function(c){ return String(c).trim() !== ''; }); });
}

/* ═══════════ Хранилище файлов (IndexedDB) ═══════════
   Метаданные документов живут в DB, сами файлы — в IndexedDB браузера.
   Если IndexedDB недоступна (приватный режим), файлы держатся в памяти до перезагрузки. */
var FileStore = (function(){
  var DBN = 'kadrgranitsa-files', ST = 'files', mem = {}, dbp = null;
  function open(){
    if(dbp) return dbp;
    dbp = new Promise(function(res){
      try{
        var rq = indexedDB.open(DBN, 1);
        rq.onupgradeneeded = function(){ rq.result.createObjectStore(ST); };
        rq.onsuccess = function(){ res(rq.result); };
        rq.onerror = function(){ res(null); };
      }catch(e){ res(null); }
    });
    return dbp;
  }
  function tx(mode, fn){
    return open().then(function(db){
      if(!db) return fn(null);
      return new Promise(function(res){
        try{
          var t = db.transaction(ST, mode), s = t.objectStore(ST), r = fn(s);
          t.oncomplete = function(){ res(r && r.result !== undefined ? r.result : undefined); };
          t.onerror = function(){ res(undefined); };
        }catch(e){ res(fn(null)); }
      });
    });
  }
  return {
    put: function(key, blob){ mem[key] = blob; return tx('readwrite', function(s){ return s ? s.put(blob, key) : null; }); },
    get: function(key){
      if(mem[key]) return Promise.resolve(mem[key]);
      return tx('readonly', function(s){ return s ? s.get(key) : null; }).then(function(v){ return v || mem[key] || null; });
    },
    clear: function(){ mem = {}; return tx('readwrite', function(s){ return s ? s.clear() : null; }); }
  };
})();

}

/* ───────── Журнал доказательств: append-only, хэш-цепочка SHA-256 ───────── */
function jHash(e){
  return sha256([e.prev, e.seq, e.ts, e.user, e.type, e.text, e.empId||'', e.docId||'', e.key||''].join('|'));
}
function sealJournal(){
  var prev = '0'.repeat(64);
  DB.journal.forEach(function(e, i){
    e.seq = i + 1;
    e.empId = e.empId || (e.ref && e.ref.empId) || null;
    delete e.ref;
    e.prev = prev;
    e.hash = jHash(e);
    prev = e.hash;
  });
}
function logJ(type, text, o){
  o = o || {};
  var last = DB.journal[DB.journal.length - 1];
  var e = { seq: (last ? last.seq : 0) + 1, ts: nowStamp(), user: o.user || Q.user().name, type: type, text: text,
    empId: o.empId || null, docId: o.docId || null, key: o.key || null, prev: last ? last.hash : '0'.repeat(64) };
  e.hash = jHash(e);
  DB.journal.push(e);
  return e;
}
function verifyChain(list){
  list = list || DB.journal;
  var prev = '0'.repeat(64);
  for(var i=0;i<list.length;i++){
    var e = list[i];
    if(e.prev !== prev) return {ok:false, at:e.seq, why:'нарушена связь с предыдущей записью'};
    if(jHash(e) !== e.hash) return {ok:false, at:e.seq, why:'содержимое записи изменено после фиксации'};
    prev = e.hash;
  }
  return {ok:true, n:list.length, head:prev};
}

function makeCtx(o){
  o = o || {};
  var docsBy = {}, notifBy = {};
  (o.documents || DB.documents).forEach(function(d){ if(d.empId) (docsBy[d.empId] = docsBy[d.empId] || []).push(d); });
  (o.notifications || DB.notifications).forEach(function(n){ (notifBy[n.empId] = notifBy[n.empId] || []).push(n); });
  var objs = {}; (o.objects || DB.objects).forEach(function(x){ objs[x.id] = x; });
  return {
    docs: function(id){ return docsBy[id] || []; },
    notifs: function(id){ return notifBy[id] || []; },
    obj: function(id){ return objs[id] || {name:'—', region:'—'}; },
    contr: function(id){ return Q.contr(id); },
    ack: function(id){ return (o.ack || DB.ack)[id]; },
    decision: function(k){ return o.ignoreDecisions ? null : DB.decisions[k]; },
    version: o.version || function(id){ return ruleActive(id); },
    skipDocs: !!o.skipDocs
  };
}
function evalEmployee(e, ctx, wantTrace){
  var items = [], trace = [];
  RULE_ORDER.forEach(function(rid){
    var v = ctx.version(rid);
    var tr = { rule:rid, v:v ? v.v : null, lines:[], result:'ok' };
    if(!v){ tr.result = 'inactive'; trace.push(tr); return; }
    var X = {
      na: function(t){ tr.result = 'na'; tr.lines.push({t:t, ok:null}); },
      line: function(t, ok){ tr.lines.push({t:t, ok:ok}); },
      item: function(it){
        it.ruleId = rid; it.ruleV = v.v; it.empId = e.id; it.objectId = e.objectId; it.contractorId = e.contractorId || null;
        it.key = rid + ':' + e.id + (it.sub ? ':' + it.sub : '');
        var dec = ctx.decision(it.key);
        if(dec && (dec.verdict === 'accepted' || dec.verdict === 'false_positive')){
          tr.lines.push({t:'Закрыто решением юриста ' + dec.by + ' от ' + dmy(dec.at) + ': ' + dec.label, ok:true}); return;
        }
        if(it.art){ it.sanction = sanctionFor(it.art, it.region || ctx.obj(e.objectId).region); }
        items.push(it); tr.result = it.type;
      }
    };
    if(e.firedAt && rid !== 'R-02' && rid !== 'R-01'){ X.na('трудовые отношения прекращены ' + dmy(e.firedAt)); trace.push(tr); return; }
    RULE_IMPL[rid](e, ctx, v.params, X);
    trace.push(tr);
  });
  return wantTrace ? {items:items, trace:trace} : items;
}

      title:'Подтверждения подрядчика устарели: ' + c.name, since:iso(addDays(parseISO(c.lastConfirm), v.params.maxAgeDays + 1)), fix:'contractor',
      why:'Последний пакет подтверждений по ' + n + ' работникам получен ' + dmy(c.lastConfirm) + ' (' + age + ' дн. назад, норма — ' + v.params.maxAgeDays + ' дн.).' +
        (c.request ? ' Запрос отправлен ' + dmy(c.request.at) + ', ответ ожидается до ' + dmy(c.request.due) + '.' : ' Запрос подрядчику не отправлялся.') +
        ' Без актуальных подтверждений заказчик не может доказать легальность работников на объектах.',
      steps:['Отправить подрядчику запрос подтверждений','Принять пакет: уведомления, патенты, чеки по каждому работнику','Расхождения — в нарушения по работникам'] };

var ITEMS = [], ITEM_BY = {}, ITEMS_EMP = {};
function reconcile(opt){
  opt = opt || {};
  var ctx = makeCtx(), all = [];
  DB.employees.forEach(function(e){ all = all.concat(evalEmployee(e, ctx)); });
  all = all.concat(evalContractors());
  var now = {}, fresh = [];
  all.forEach(function(it){
    now[it.key] = it;
    var st = DB.itemState[it.key];
    if(!st){
      st = DB.itemState[it.key] = { firstSeen: it.since && it.since < iso(TODAY) ? it.since : iso(TODAY), owner: it.lawyer ? 'Смирнов Д. А.' : (it.contractorId ? 'подрядчик → ' + DB.company.responsible : DB.company.responsible),
        status:'new', type:it.type, evidence:[] };
      if(!opt.initial) fresh.push(it);
    }
    if(st.type !== it.type){ st.type = it.type; if(it.type === 'violation'){ st.firstSeen = iso(TODAY); if(!opt.initial) fresh.push(it); } }
    if(it.type === 'violation' && !st.planDue){
      st.planDue = iso(addDays(parseISO(st.firstSeen), ({crit:3, high:7, mid:30, low:90})[it.severity]));
      if(daysLeft(st.planDue) < 0) st.planDue = iso(addDays(TODAY, it.severity === 'crit' ? 1 : 3));
    }
    it.state = st;
    it.dueEff = it.type === 'violation' ? st.planDue : it.due;
    var escal = (it.type === 'violation' && it.severity === 'crit') || (it.type === 'deadline' && daysLeft(it.due) <= DB.settings.escalateDays);
    if(escal && !st.escalated){
      st.escalated = iso(TODAY);
      if(!opt.initial) logJ('alert', 'Эскалация руководителю (' + DB.company.escalateTo + '): ' + it.title + (it.empId ? ' — ' + Q.emp(it.empId).fio : ''), {empId:it.empId, key:it.key, user:'система'});
    }
  });
  /* устранённые */
  var gone = [];
  Object.keys(DB.itemState).forEach(function(k){
    if(now[k]) return;
    var st = DB.itemState[k];
    if(!opt.silent && st.type === 'violation'){
      var p = k.split(':'), e = Q.emp(p[1]);
      var rec = { key:k, ruleId:p[0], empId:e ? e.id : null, title:st.title || k, severity:st.severity || 'high', firstSeen:st.firstSeen,
        closedAt:iso(TODAY), evidence: st.evidence && st.evidence.length > 0, by:Q.user().name, how:opt.how || 'повторная проверка правилом' };
      DB.resolved.push(rec);
      gone.push(rec);
      logJ('resolve', 'Повторная проверка ' + p[0] + ': нарушение устранено — ' + rec.title + (e ? ' (' + e.fio + ')' : '') + (rec.evidence ? ' · доказательство приложено' : ' · без доказательства'),
        {empId:e ? e.id : null, key:k, user:'система', docId:(st.evidence||[])[0] || null});

  all.forEach(function(it){ it.state.title = it.title; it.state.severity = it.severity; });
  if(fresh.length && !opt.quietNew){
    var v = fresh.filter(function(x){ return x.type === 'violation'; });

  }

    if(SEV[a.severity].o !== SEV[b.severity].o) return SEV[a.severity].o - SEV[b.severity].o;
    return String(a.dueEff||'').localeCompare(String(b.dueEff||''));
  });
  ITEMS = all; ITEM_BY = now; ITEMS_EMP = {};

    var a = Q.active(); return {n:a.filter(function(e){ return !bad[e.id]; }).length, of:a.length};
  },

      DB.tasks.filter(function(t){ var d = daysLeft(t.due); return t.status === 'open' && d >= 0 && d <= 7; }).length; },
  recentResolved: function(days){ return DB.resolved.filter(function(r){ return -daysLeft(r.closedAt) <= (days||90); }); },

    var a = M.recentResolved(90).map(function(r){ return Math.max(0, daysBetween(r.firstSeen, r.closedAt)); }).sort(function(x,y){ return x-y; });
    if(!a.length) return null;

  },

function filteredEmps(){
  var q = state.empSearch.trim().toLowerCase(), f = state.empFilter;
  return DB.employees.filter(function(e){
    if(f === 'fired'){ if(!e.firedAt) return false; }
    else if(e.firedAt) return false;
    if(state.empObj && e.objectId !== state.empObj) return false;
    if(state.empSt && e.status !== state.empSt) return false;
    var r = riskOfEmp(e.id);
    if(f === 'crit' && r !== 'crit') return false;
    if(f === 'high' && r !== 'high') return false;
    if(f === 'ok' && r !== 'low') return false;
    if(f === 'mid' && r !== 'mid') return false;
    if(f === 'contr' && !e.contractorId) return false;
    if(q && (e.fio + ' ' + e.citizenship + ' ' + e.position + ' ' + objName(e.objectId) + ' ' + e.status + ' ' + (e.patent ? e.patent.no : '') + ' ' + e.passportNo).toLowerCase().indexOf(q) < 0) return false;
    return true;
  }).sort(empSorter());
}
function nextDue(e){ var d = itemsFor(e.id).map(function(i){ return i.dueEff; }).filter(Boolean).sort()[0]; return d || '9999'; }
function empSorter(){
  var o = {crit:0,high:1,mid:2,low:3}, k = state.empSort || 'risk';
  if(k === 'name') return function(a,b){ return a.fio.localeCompare(b.fio); };
  if(k === 'due') return function(a,b){ return nextDue(a) < nextDue(b) ? -1 : nextDue(a) > nextDue(b) ? 1 : a.fio.localeCompare(b.fio); };
  if(k === 'hired') return function(a,b){ return a.hiredAt < b.hiredAt ? 1 : -1; };
  if(k === 'obj') return function(a,b){ return objName(a.objectId).localeCompare(objName(b.objectId)) || a.fio.localeCompare(b.fio); };
  return function(a,b){ return o[riskOfEmp(a.id)] - o[riskOfEmp(b.id)] || a.fio.localeCompare(b.fio); };
}

  h += '<div class="toolbar"><div class="chips">' + chip('all','Все', act.length) + chip('crit','Есть нарушение', cnt.crit) + chip('high','Нужно внимание', cnt.high) +
    chip('ok','В порядке', cnt.low) + chip('contr','Подрядчики', cnt.contr) + chip('fired','Уволенные', DB.employees.length - act.length) + '</div>' +
    '<div class="tools"><select id="empobj" class="sel" aria-label="Объект"><option value="">Все объекты</option>' + DB.objects.map(function(o){ return '<option value="' + o.id + '"' + (state.empObj===o.id?' selected':'') + '>' + esc(o.name) + '</option>'; }).join('') + '</select>' +
    '<select id="empst" class="sel" aria-label="Статус"><option value="">Все статусы</option>' + STATUSES.map(function(x){ return '<option' + (state.empSt===x?' selected':'') + '>' + x + '</option>'; }).join('') + '</select>' +
    '<select id="empsort" class="sel" aria-label="Сортировка">' + [['risk','Сначала проблемные'],['due','По ближайшему сроку'],['name','По алфавиту'],['obj','По объекту'],['hired','Недавно принятые']].map(function(x){ return '<option value="' + x[0] + '"' + ((state.empSort||'risk')===x[0]?' selected':'') + '>' + x[1] + '</option>'; }).join('') + '</select>' +
    '<div class="srch2">' + icon('search', 'sm') + '<input id="empq" placeholder="ФИО, номер патента, должность…" value="' + esc(state.empSearch) + '"></div></div></div>';
  h += '<div class="card"><div class="tw"><table class="tbl"><thead><tr><th>Сотрудник</th><th>Статус</th><th>Объект</th><th>Что ближайшее</th><th>Состояние</th></tr></thead><tbody>';

  shown.forEach(function(e){
    var its = itemsFor(e.id), next = its.slice().sort(function(a,b){ if(a.type !== b.type) return a.type === 'violation' ? -1 : 1; return (a.dueEff||'') < (b.dueEff||'') ? -1 : 1; })[0];
    h += '<tr class="clk" data-act="emp:' + e.id + '"><td><span class="nm">' + ava(e.fio) + esc(e.fio) + '</span><div class="sub2">' + esc(e.citizenship) + ' · ' + esc(e.position) + '</div></td>' +
      '<td><span class="pill tea">' + esc(e.status) + '</span></td>' +

      '<td>' + (next ? '<span class="sub3">' + esc(next.title) + '</span><br>' + whenText(next) + (its.length > 1 ? ' <span class="sub2">и ещё ' + (its.length - 1) + '</span>' : '') : (e.firedAt ? '<span class="sub2">уволен ' + dmy(e.firedAt) + '</span>' : '<span class="sub2">всё в порядке</span>')) + '</td>' +
      '<td>' + riskPill(riskOfEmp(e.id)) + '</td></tr>';
  });
  h += '</tbody></table></div>';
  if(shown.length < list.length) h += '<div class="pf center"><button class="btn o" data-act="loadMore">Показать ещё · ' + shown.length + ' из ' + nfmt(list.length) + '</button></div>';
  h += '</div>';
  return h;
};

/* ═══════════ ЭКРАН: КАРТОЧКА СОТРУДНИКА ═══════════
   Наверху — «следующий шаг» одной строкой. Слева — вкладки (дела, документы, история),
   справа — шкалы сроков документов, досье, риск и проверка по реестрам. */
function validityLines(e){
  var L = [];
  if(e.patent){
    L.push({k:'Оплата патента (НДФЛ-аванс)', d:e.patent.paidTo, w:31});
    L.push({k:'Патент · 12 месяцев с выдачи', d:iso(addDays(addMonths(parseISO(e.patent.issuedAt), 12), -1)), w:365});
  }
  if(e.permit) L.push({k:e.permit.kind === 'ВКС' ? 'Разрешение ВКС' : 'Разрешение на работу', d:e.permit.validTo, w:365});
  if(e.rp) L.push({k:e.rp.kind, d:e.rp.validTo, w:1095});
  L.push({k:'Миграционный учёт', d:e.regTo, w:90});
  if(e.dmsTo) L.push({k:'Полис ДМС', d:e.dmsTo, w:365});
  L.push({k:'Паспорт', d:e.passportTo, w:1825});
  return L.sort(function(a, b){ return a.d < b.d ? -1 : 1; });
}
function vlHTML(x){
  var n = daysLeft(x.d), c = n < 0 || n <= 3 ? 'r' : n <= 14 ? 'a' : 'g';
  var pct = Math.max(3, Math.min(100, Math.round(n / x.w * 100)));
  return '<div class="vl"><span class="k">' + esc(x.k) + '</span><span class="d ' + c + '">' + dmy(x.d) + '<small>' + esc(n < 0 ? 'истёк ' + Math.abs(n) + ' дн. назад' : n === 0 ? 'истекает сегодня' : 'ещё ' + n + ' ' + plural(n,'день','дня','дней')) + '</small></span>' +
    '<span class="bar"><i class="' + c + '" style="width:' + (n < 0 ? 100 : pct) + '%"></i></span></div>';
}

function wizEmp(){ return state.wiz && state.wiz.empId ? Q.emp(state.wiz.empId) : null; }
function wizDeadline(w){ return w.kind === 'vks' ? lastQuarter(TODAY).due : addWorkdays(w.eventDate, (ruleParams(w.kind === 'fire' ? 'R-02' : 'R-01') || {deadlineWd:3}).deadlineWd); }
function wizChecks(){
  var w = state.wiz, e = wizEmp(), out = [];
  if(!e){ out.push({t:'bad', x:'Сотрудник не выбран'}); return out; }
  var dl = wizDeadline(w), left = workdaysBetween(iso(TODAY), dl);
  out.push({t:'ok', x:'Досье: ' + e.fio + ', ' + e.citizenship + ', ' + e.status + ', паспорт ' + e.passportNo});
  if(w.kind !== 'vks'){
    if(daysLeft(dl) >= 0) out.push({t: left <= 1 ? 'warn' : 'ok', x:'Срок подачи — до ' + dmy(dl) + ' включительно (3 рабочих дня после ' + dmy(w.eventDate) + '): осталось ' + left + ' раб. дн.'});
    else out.push({t:'bad', x:'Срок подачи истёк ' + dmy(dl) + ' — просрочка ' + workdaysBetween(dl, iso(TODAY)) + ' раб. дн. Подайте сегодня; причину просрочки система передаст юристу.'});
  } else out.push({t: daysLeft(dl) >= 0 ? 'ok' : 'bad', x:'Срок подачи за ' + lastQuarter(TODAY).q + ' кв. — до ' + dmy(dl)});
  var key = e.patent ? 'patent' : e.permit ? 'permit' : e.rp ? 'rp' : null;
  if(key){
    var to = key === 'patent' ? e.patent.paidTo : (e[key].validTo);
    if(daysLeft(to) < 0) out.push({t:'bad', x:'Основание для работы не действует (' + (key==='patent' ? 'оплачено по ' : 'до ') + dmy(to) + ') — подача уведомления не снимает нарушения'});
    else out.push({t:'ok', x:'Разрешительный документ действует (' + (key==='patent' ? 'оплачено по ' : 'до ') + dmy(to) + ')'});
  }
  if(w.kind === 'hire' && e.patent && e.patent.region !== Q.obj(e.objectId).region) out.push({t:'bad', x:'Регион патента (' + e.patent.region + ') ≠ регион объекта — см. правило R-05'});
  if(w.kind === 'vks' && e.status !== 'ВКС') out.push({t:'bad', x:'Уведомление о выплатах применимо только к ВКС'});
  out.push({t:'ok', x:'Адресат по региону объекта: ' + w.organ});
  if(!w.contractNo) out.push({t:'warn', x:'Не указан номер договора'});
  return out;
}

}
